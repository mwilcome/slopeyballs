<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Slopeyballs</title>
  <meta name="description" content="Hold to spin. Ride the hills. Play in the browser.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@PiousProgrammer">
  <meta name="twitter:title" content="Slopeyballs">
  <meta name="twitter:description" content="Hold to spin. Ride the hills. Play in the browser.">
  <meta property="og:title" content="Slopeyballs">
  <meta property="og:description" content="Hold to spin. Ride the hills. Play in the browser.">
  <meta property="og:url" content="https://mwilcome.github.io/slopeyballs/">
  <meta name="theme-color" content="#12082a">
  <style>
    html, body { margin: 0; height: 100%; background: #070218; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const BANDS = ["#fff6a8", "#ffe14a", "#ffb02e", "#ff7a3c", "#ff4da0", "#ff2d88", "#c42cff", "#6b1ad6"];
  const SAVE = "slopeyballs-save";

  const defaults = () => ({ spin: 0, grip: 0, mass: 0, tickets: 0, best: 0 });
  function loadSave() {
    try { return { ...defaults(), ...JSON.parse(localStorage.getItem(SAVE) || "{}") }; }
    catch { return defaults(); }
  }
  function writeSave() {
    localStorage.setItem(SAVE, JSON.stringify({
      spin: up.spin, grip: up.grip, mass: up.mass, tickets: up.tickets, best: up.best
    }));
  }
  const up = loadSave();
  if (!up.best) up.best = Number(localStorage.getItem("slopeyballs-best") || 0);

  function ballR() { return 20 + up.mass * 2.2; }
  function spinForce() { return 2400 + up.spin * 480; }
  function gravity() { return 2000 + up.mass * 180; }
  function gripStick() { return 0.07 * Math.pow(0.72, up.grip); }
  function maxSpeed() { return 1500 + up.spin * 80 - up.mass * 40; }
  function cost(level) { return 20 * (level + 1) * (level + 1); }

  const state = {
    mode: "title",
    hold: false,
    rev: false,
    mute: false,
    hidden: false,
    x: 80, y: 400, vx: 0, vy: 0,
    spin: 0, omega: 0, grounded: false,
    maxX: 80, progressX: 80, stall: 0, reason: "",
    runMeters: 0,
    camX: 0, camY: 80, horizonY: 400, shake: 0, flash: 0,
    dust: [],
    seed: 1
  };

  let audioCtx = null;
  let hum = null;
  let music = null;

  function rng(seed) {
    let s = seed | 0;
    return () => {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  const pts = [];
  let rand = rng(1);
  const MAX_UP = 0.52;

  function lastX() { return pts.length ? pts[pts.length - 2] : 0; }
  function lastY() { return pts.length ? pts[pts.length - 1] : 430; }

  function add(nx, ny, steepDown) {
    if (pts.length >= 2) {
      const lx = pts[pts.length - 2];
      const ly = pts[pts.length - 1];
      if (nx <= lx) nx = lx + 48;
      const dx = nx - lx;
      if (ny > ly) ny = Math.min(ly + dx * MAX_UP, ny);
      else ny = Math.max(ly - dx * (steepDown ? 1.18 : 0.9), ny);
    }
    pts.push(nx, ny);
  }

  function appendChunk() {
    let x = lastX();
    let y = lastY();
    const d = Math.min(1.4, Math.max(0, (x - 400) / 9000));
    const r = rand();

    function huge() {
      const w = 700 + rand() * (500 + d * 1400);
      const want = 120 + rand() * (90 + d * 280);
      const rise = Math.min(want, (w * 0.5) * MAX_UP);
      add(lastX() + w * 0.5, lastY() - rise);
      add(lastX() + w * 0.5, lastY() + rise * (0.05 + rand() * 0.25), true);
    }
    function rollers() {
      const n = 2 + ((rand() * (2 + d)) | 0);
      for (let i = 0; i < n; i++) {
        const w = 70 + rand() * 90;
        const a = 22 + rand() * (28 + d * 40);
        const base = lastY();
        add(lastX() + w, base - a);
        add(lastX() + w, base + a * (0.1 + rand() * 0.2));
      }
    }
    function drop() {
      const w = 280 + rand() * (200 + d * 400);
      add(lastX() + w, lastY() + (70 + rand() * (50 + d * 90)), true);
    }
    function rest() {
      add(lastX() + 140 + rand() * 120, lastY() + (rand() - 0.5) * 18);
    }

    if (x < 600) rest();
    else if (r < 0.28) huge();
    else if (r < 0.52) rollers();
    else if (r < 0.7) drop();
    else if (r < 0.84) { rollers(); huge(); }
    else rest();

    if (lastY() < -200) add(lastX() + 200, lastY() + 80, true);
    if (lastY() > 900) add(lastX() + 200, lastY() - 80);
  }

  function buildStart(seed) {
    pts.length = 0;
    rand = rng(seed);
    add(-400, 440);
    add(480, 440);
    let guard = 0;
    while (lastX() < 2500 && guard++ < 80) appendChunk();
  }

  function ensureTerrain() {
    let guard = 0;
    while (lastX() < state.x + 5000 && guard++ < 40) appendChunk();
    while (pts.length > 8 && pts[6] < state.camX - 2500) pts.splice(0, 2);
  }

  function segIndex(x) {
    let lo = 0, hi = (pts.length / 2) - 2;
    if (hi < 0) return 0;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (pts[mid * 2] <= x) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  }

  function heightAt(x) {
    const i = Math.max(0, Math.min(segIndex(x), pts.length / 2 - 2));
    const x0 = pts[i * 2], y0 = pts[i * 2 + 1];
    const x1 = pts[i * 2 + 2], y1 = pts[i * 2 + 3];
    const span = x1 - x0 || 1;
    let t = (x - x0) / span;
    t = Math.max(0, Math.min(1, t));
    t = t * t * (3 - 2 * t);
    return y0 + (y1 - y0) * t;
  }

  function slopeAt(x) {
    return (heightAt(x + 4) - heightAt(x - 4)) / 8;
  }

  function meters() {
    return Math.max(0, Math.floor((state.maxX - 80) / 8));
  }

  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    startMusic();
  }

  function beep(freq, dur, type = "sine", vol = 0.07, slide = 0) {
    if (state.mute || !audioCtx) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function setHum(on) {
    if (state.mute || !audioCtx) {
      if (hum) { hum.stop(); hum = null; }
      return;
    }
    if (on && !hum) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sawtooth";
      o.frequency.value = 62;
      g.gain.value = 0.018;
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      hum = { stop() { o.stop(); hum = null; }, osc: o };
    }
    if (!on && hum) hum.stop();
    if (on && hum) {
      const spd = Math.hypot(state.vx, state.vy);
      hum.osc.frequency.setTargetAtTime(62 + spd * 0.07, audioCtx.currentTime, 0.08);
    }
  }

  function noiseBuf() {
    const n = audioCtx.sampleRate * 0.25;
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function startMusic() {
    if (music || !audioCtx || state.mute) return;
    const master = audioCtx.createGain();
    master.gain.value = 0.07;
    master.connect(audioCtx.destination);
    const nb = noiseBuf();
    let step = 0;
    const bpm = 104;
    const interval = 60 / bpm / 2;
    const bass = [82.41, 82.41, 110, 110, 98, 98, 73.42, 73.42];
    const arp = [329.63, 392, 493.88, 587.33, 493.88, 392, 329.63, 261.63];

    function blip(freq, dur, type, vol, t) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(master);
      o.start(t);
      o.stop(t + dur + 0.02);
    }
    function drum(kind, t) {
      if (kind === "k") {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.setValueAtTime(90, t);
        o.frequency.exponentialRampToValueAtTime(38, t + 0.12);
        g.gain.setValueAtTime(0.9, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
        o.connect(g);
        g.connect(master);
        o.start(t);
        o.stop(t + 0.16);
      } else {
        const src = audioCtx.createBufferSource();
        const g = audioCtx.createGain();
        const f = audioCtx.createBiquadFilter();
        src.buffer = nb;
        f.type = kind === "s" ? "highpass" : "highpass";
        f.frequency.value = kind === "s" ? 1800 : 8000;
        g.gain.setValueAtTime(kind === "s" ? 0.22 : 0.07, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + (kind === "s" ? 0.12 : 0.04));
        src.connect(f);
        f.connect(g);
        g.connect(master);
        src.start(t);
        src.stop(t + 0.15);
      }
    }

    const id = setInterval(() => {
      if (state.mute || !audioCtx) return;
      const t = audioCtx.currentTime + 0.03;
      const s = step % 8;
      if (s === 0 || s === 4) drum("k", t);
      if (s === 2 || s === 6) drum("s", t);
      drum("h", t);
      blip(bass[s], 0.28, "sawtooth", 0.22, t);
      blip(arp[s] * 2, 0.09, "square", 0.045, t);
      step++;
    }, interval * 1000);

    music = {
      stop() {
        clearInterval(id);
        master.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
        music = null;
      }
    };
  }

  function burst(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI - 0.2;
      const s = 80 + Math.random() * 160;
      state.dust.push({
        x, y, vx: Math.cos(a) * s * 0.25 - 30, vy: -Math.random() * s,
        life: 0.25 + Math.random() * 0.35, color, r: 1.4 + Math.random() * 2.2
      });
    }
  }

  function resetRun() {
    state.seed = (Math.random() * 1e9) | 0;
    buildStart(state.seed);
    const R = ballR();
    state.x = 90;
    state.y = heightAt(90) - R;
    state.vx = 0;
    state.vy = 0;
    state.spin = 0;
    state.omega = 0;
    state.maxX = 90;
    state.progressX = 90;
    state.stall = 0;
    state.reason = "";
    state.runMeters = 0;
    state.camX = 0;
    state.camY = state.y - view.cssH * 0.58;
    state.horizonY = heightAt(state.x) - state.camY;
    state.dust.length = 0;
    state.mode = "play";
    state.flash = 0.08;
  }

  function crash(reason) {
    if (state.mode !== "play") return;
    state.mode = "dead";
    state.reason = reason || "";
    state.hold = false;
    state.rev = false;
    setHum(false);
    const m = meters();
    state.runMeters = m;
    const earned = Math.max(1, Math.floor(m / 8));
    up.tickets += earned;
    if (m > up.best) up.best = m;
    writeSave();
    state.shake = 10;
    beep(90, 0.28, "square", 0.06, -50);
  }

  function tryBuy(stat) {
    const c = cost(up[stat]);
    if (up.tickets < c) {
      beep(140, 0.08, "square", 0.04);
      return;
    }
    up.tickets -= c;
    up[stat]++;
    writeSave();
    beep(520, 0.1, "sine", 0.06);
    beep(780, 0.14, "triangle", 0.04);
  }

  function update(dt) {
    if (state.hidden) return;
    state.shake *= Math.pow(0.002, dt);
    state.flash = Math.max(0, state.flash - dt * 2);
    for (const p of state.dust) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 500 * dt;
    }
    state.dust = state.dust.filter(p => p.life > 0);

    if (state.mode !== "play") {
      setHum(false);
      return;
    }

    ensureTerrain();
    const R = ballR();
    const spinning = state.hold || state.rev;
    const dir = state.rev ? -1 : state.hold ? 1 : 0;

    const dydx = slopeAt(state.x);
    const len = Math.hypot(1, dydx) || 1;
    const tx = 1 / len, ty = dydx / len;
    const nx = dydx / len, ny = -1 / len;
    const ground = heightAt(state.x);
    const dist = ground - state.y;

    if (dist < R) {
      const push = R - dist;
      state.x += nx * push;
      state.y += ny * push;
      const vn = state.vx * nx + state.vy * ny;
      if (vn < 0) {
        const hard = -vn > 520;
        const stick = spinning ? 1.02 : 1.18;
        state.vx -= vn * nx * stick;
        state.vy -= vn * ny * stick;
        if (hard) {
          state.shake = Math.min(12, -vn * 0.012);
          burst(state.x, state.y + R * 0.6, 8, "rgba(255,180,80,0.5)");
          beep(220, 0.06, "triangle", 0.03);
        }
      }
      state.grounded = true;
    } else state.grounded = false;

    state.vy += gravity() * dt;

    if (dir) {
      state.omega += 18 * dt * dir;
      if (state.grounded) {
        state.vx += tx * spinForce() * dir * dt;
        state.vy += ty * spinForce() * dir * dt;
        if (Math.random() < dt * 16) burst(state.x - 8 * dir, state.y + R * 0.4, 1, "rgba(255,90,180,0.5)");
      } else state.vx += 70 * dir * dt;
    } else state.omega *= Math.pow(0.25, dt);

    if (state.grounded) {
      let vt = state.vx * tx + state.vy * ty;
      let vn2 = state.vx * nx + state.vy * ny;
      vt *= spinning ? 0.999 : 0.985;
      vn2 *= spinning ? gripStick() : 0.42;
      state.vx = tx * vt + nx * vn2;
      state.vy = ty * vt + ny * vn2;
    }

    const spd = Math.hypot(state.vx, state.vy);
    const cap = maxSpeed();
    if (spd > cap) {
      state.vx *= cap / spd;
      state.vy *= cap / spd;
    }

    state.x += state.vx * dt;
    state.y += state.vy * dt;
    state.spin += (state.vx / R) * dt;
    if (state.x > state.maxX) state.maxX = state.x;

    if (state.x > state.progressX + 12) {
      state.progressX = state.x;
      state.stall = 0;
    } else if (state.maxX > 250) {
      if (spd < 50 && !state.rev) state.stall += dt;
      else if (state.rev) state.stall += dt * 0.22;
      else state.stall += dt * 0.18;
      if (state.stall > 4.2) crash("stall");
    }
    if (state.y > heightAt(state.x) + 280) crash("fall");
    if (state.x < -80) crash("stall");

    setHum(spinning);

    const look = Math.min(240, Math.max(0, state.vx * 0.18));
    state.camX += (state.x - view.cssW * 0.3 + look - state.camX) * Math.min(1, dt * 5);
    state.camY += (state.y - view.cssH * 0.58 - state.camY) * Math.min(1, dt * 3.2);
  }

  let view = { s: 1, cssW: 1, cssH: 1, dpr: 1 };
  const ui = { hits: [] };

  function layout() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    view.dpr = dpr;
    view.cssW = w;
    view.cssH = h;
    view.s = dpr;
  }

  function drawBandedSun(cx, cy, radius) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.clip();
    const h = radius * 2;
    for (let i = 0; i < BANDS.length; i++) {
      ctx.fillStyle = BANDS[i];
      ctx.fillRect(cx - radius - 1, cy - radius + (h * i) / BANDS.length, radius * 2 + 2, h / BANDS.length + 1);
    }
    ctx.restore();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,240,180,0.55)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawGrid(horizon, floor) {
    const w = view.cssW, h = view.cssH;
    const vpX = w * 0.5;
    ctx.save();
    ctx.beginPath();
    if (floor) ctx.rect(0, horizon, w, h - horizon);
    else ctx.rect(0, 0, w, horizon);
    ctx.clip();
    ctx.strokeStyle = floor ? "rgba(255,45,200,0.42)" : "rgba(255,45,200,0.22)";
    ctx.lineWidth = 1;
    for (let i = -22; i <= 22; i++) {
      ctx.beginPath();
      ctx.moveTo(vpX, horizon);
      ctx.lineTo(vpX + i * (w / 11), floor ? h + 40 : -40);
      ctx.stroke();
    }
    const rows = floor ? 14 : 8;
    for (let i = 1; i <= rows; i++) {
      const t = i / rows;
      const y = floor ? horizon + (h - horizon) * t * t : horizon * (1 - t * t);
      ctx.globalAlpha = 0.12 + t * 0.45;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawCityLayer(horizon, par, scale, colors) {
    const w = view.cssW;
    const bW = [42, 28, 56, 34, 48, 22, 70, 36, 30, 50];
    const bH = [80, 130, 96, 168, 74, 148, 110, 180, 88, 140];
    let bx = -((par % 64));
    let k = 0;
    while (bx < w + 90) {
      const ww = bW[k % bW.length] * scale;
      const hh = bH[k % bH.length] * scale;
      const col = colors[k % colors.length];
      ctx.fillStyle = col;
      ctx.fillRect(bx, horizon - hh, ww - 3, hh);
      ctx.strokeStyle = "rgba(255,80,200,0.35)";
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, horizon - hh, ww - 3, hh);
      if (k % 5 === 2) {
        ctx.beginPath();
        ctx.moveTo(bx + ww * 0.35, horizon - hh);
        ctx.lineTo(bx + ww * 0.45, horizon - hh - 16 * scale);
        ctx.lineTo(bx + ww * 0.55, horizon - hh);
        ctx.fill();
      }
      ctx.fillStyle = k % 2 ? "rgba(80,230,255,0.55)" : "rgba(255,140,220,0.45)";
      for (let wy = 10 * scale; wy < hh - 8; wy += 9 * scale) {
        for (let wx = 5 * scale; wx < ww - 8; wx += 8 * scale) {
          if ((k + wy + wx) % 4 !== 0) ctx.fillRect(bx + wx, horizon - hh + wy, 2.2 * scale, 3.2 * scale);
        }
      }
      bx += ww + 4 * scale;
      k++;
    }
  }

  function clipAboveTerrain() {
    if (pts.length < 4) return;
    const w = view.cssW;
    const camX = state.camX, camY = state.camY;
    const left = camX - 40, right = camX + w + 40;
    ctx.beginPath();
    ctx.moveTo(-40, -40);
    ctx.lineTo(w + 40, -40);
    for (let x = right; x >= left; x -= 6) {
      ctx.lineTo(x - camX, heightAt(x) - camY);
    }
    ctx.closePath();
    ctx.clip();
  }

  function drawSky() {
    const w = view.cssW, h = view.cssH;
    const horizon = h * 0.36;
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#050218");
    g.addColorStop(0.32, "#1a0670");
    g.addColorStop(0.5, "#7a1ad0");
    g.addColorStop(0.62, "#ff4da0");
    g.addColorStop(1, "#120436");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    const sunX = w * 0.5, sunY = horizon - 20;
    const sunR = Math.min(148, h * 0.2);
    const glow = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, sunR * 1.6);
    glow.addColorStop(0, "rgba(255,200,80,0.55)");
    glow.addColorStop(0.5, "rgba(255,60,160,0.18)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR * 1.6, 0, Math.PI * 2);
    ctx.fill();
    drawBandedSun(sunX, sunY, sunR);

    ctx.save();
    clipAboveTerrain();

    ctx.fillStyle = "#cfe9ff";
    const skyH = Math.max(48, horizon - 8);
    for (let i = 0; i < 50; i++) {
      const sx = ((i * 97 + state.camX * 0.02) % w + w) % w;
      const sy = (i * 37) % skyH;
      ctx.globalAlpha = 0.35 + (i % 5) * 0.12;
      ctx.fillRect(sx, sy, i % 7 === 0 ? 2 : 1, i % 7 === 0 ? 2 : 1);
    }
    ctx.globalAlpha = 1;
    drawGrid(horizon, false);

    drawCityLayer(horizon, state.camX * 0.12, 0.62, ["#3a1868", "#1a3a78", "#4a2078"]);
    drawCityLayer(horizon, state.camX * 0.28, 1, ["#4b1a86", "#2a4a9a", "#6a2488", "#1c3c80", "#5a1e70"]);
    ctx.restore();
  }

  function drawHills() {
    const w = view.cssW, h = view.cssH;
    const camX = state.camX, camY = state.camY;
    const left = camX - 60;
    const right = camX + w + 60;
    const step = 6;

    function roadPath(closeDown) {
      ctx.beginPath();
      ctx.moveTo(left - camX, heightAt(left) - camY);
      for (let x = left + step; x <= right; x += step) {
        ctx.lineTo(x - camX, heightAt(x) - camY);
      }
      if (closeDown) {
        ctx.lineTo(right - camX, h + 200);
        ctx.lineTo(left - camX, h + 200);
        ctx.closePath();
      }
    }

    roadPath(true);
    ctx.fillStyle = "#0b0618";
    ctx.fill();

    ctx.save();
    roadPath(true);
    ctx.clip();
    ctx.strokeStyle = "rgba(255, 50, 200, 0.28)";
    ctx.lineWidth = 1;
    const startX = Math.floor(left / 40) * 40;
    for (let x = startX; x < right; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x - camX, heightAt(x) - camY);
      ctx.lineTo(x - camX, h + 40);
      ctx.stroke();
    }
    for (let i = 1; i <= 8; i++) {
      ctx.beginPath();
      let started = false;
      for (let x = left; x <= right; x += 16) {
        const y = heightAt(x) + i * 32;
        if (!started) { ctx.moveTo(x - camX, y - camY); started = true; }
        else ctx.lineTo(x - camX, y - camY);
      }
      ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = "#3cf6ff";
    ctx.shadowColor = "#3cf6ff";
    ctx.shadowBlur = 16;
    ctx.lineWidth = 3;
    roadPath(false);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,70,200,0.7)";
    ctx.lineWidth = 1.25;
    ctx.stroke();
  }

  function drawBall() {
    const R = ballR();
    const x = state.x - state.camX;
    const y = state.y - state.camY;
    const spinning = state.hold || state.rev;
    const glowR = spinning ? 40 : 32;
    const glow = ctx.createRadialGradient(x, y, 4, x, y, glowR);
    glow.addColorStop(0, "rgba(255,200,80,0.5)");
    glow.addColorStop(0.45, "rgba(255,60,160,0.2)");
    glow.addColorStop(1, "rgba(255,60,160,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, glowR, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.clip();
    const hh = R * 2;
    for (let i = 0; i < BANDS.length; i++) {
      ctx.fillStyle = BANDS[i];
      ctx.fillRect(-R - 1, -R + (hh * i) / BANDS.length, R * 2 + 2, hh / BANDS.length + 1);
    }
    const shade = ctx.createRadialGradient(-R * 0.25, -R * 0.3, R * 0.15, 0, 0, R);
    shade.addColorStop(0, "rgba(255,255,255,0.12)");
    shade.addColorStop(0.55, "rgba(0,0,0,0)");
    shade.addColorStop(1, "rgba(40,0,50,0.38)");
    ctx.fillStyle = shade;
    ctx.fillRect(-R, -R, R * 2, R * 2);

    ctx.strokeStyle = "rgba(20,0,40,0.28)";
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 4; i++) {
      const yaw = state.spin * 0.85 + i * Math.PI * 0.5;
      const w = Math.sin(yaw) * R;
      if (Math.abs(w) < 1.2) continue;
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.abs(w), R, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    const front = Math.cos(state.spin * 0.85);
    if (front > 0.05) {
      const hx = Math.sin(state.spin * 0.85) * R * 0.42;
      const hy = -R * 0.32;
      const spec = ctx.createRadialGradient(hx, hy, 0, hx, hy, R * 0.45);
      spec.addColorStop(0, `rgba(255,255,255,${0.18 + front * 0.28})`);
      spec.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = spec;
      ctx.beginPath();
      ctx.arc(hx, hy, R * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.beginPath();
    ctx.arc(x, y, R, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,245,200,0.85)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function btn(id, x, y, w, h, label, sub, hot) {
    ui.hits.push({ id, x, y, w, h });
    ctx.fillStyle = hot ? "rgba(255,200,80,0.2)" : "rgba(40,20,80,0.55)";
    ctx.strokeStyle = hot ? "#ffd24a" : "rgba(180,140,255,0.5)";
    ctx.lineWidth = 1.5;
    ctx.fillRect(x, y, w, h);
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = "#fff4d2";
    ctx.font = "700 15px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(label, x + 14, y + 24);
    ctx.fillStyle = "rgba(200,230,255,0.75)";
    ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
    ctx.fillText(sub, x + 14, y + 42);
  }

  function drawHud() {
    const w = view.cssW, h = view.cssH;
    ui.hits.length = 0;
    ctx.setTransform(view.s, 0, 0, view.s, 0, 0);
    ctx.font = "700 22px ui-sans-serif, system-ui, sans-serif";
    ctx.fillStyle = "#d6f7ff";
    ctx.fillText(`${state.mode === "play" ? meters() : state.runMeters} m`, 18, 34);
    ctx.font = "14px ui-sans-serif, system-ui, sans-serif";
    ctx.fillStyle = "rgba(214,247,255,0.6)";
    ctx.fillText(`BEST  ${up.best} m`, 18, 54);
    ctx.fillText(`TICKETS  ${up.tickets}`, 18, 74);

    if (state.mode === "play") {
      const padY = h - 54;
      ctx.globalAlpha = state.rev ? 1 : 0.4;
      ctx.fillStyle = "rgba(80,230,255,0.18)";
      ctx.fillRect(16, padY, 110, 38);
      ctx.strokeStyle = "#3cf6ff";
      ctx.strokeRect(16, padY, 110, 38);
      ctx.fillStyle = "#3cf6ff";
      ctx.font = "700 14px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("REV", 52, padY + 25);
      ctx.globalAlpha = state.hold ? 1 : 0.4;
      ctx.fillStyle = "rgba(255,200,70,0.18)";
      ctx.fillRect(w - 126, padY, 110, 38);
      ctx.strokeStyle = "#ffd24a";
      ctx.strokeRect(w - 126, padY, 110, 38);
      ctx.fillStyle = "#ffd24a";
      ctx.fillText("SPIN", w - 90, padY + 25);
      ctx.globalAlpha = 1;
      if (state.stall > 1.1 && state.maxX > 250) {
        const t = Math.min(1, (state.stall - 1.1) / 3.1);
        ctx.textAlign = "center";
        ctx.fillStyle = `rgba(255,210,80,${0.55 + t * 0.45})`;
        ctx.font = "700 15px ui-sans-serif, system-ui, sans-serif";
        ctx.fillText("STALLING  —  reverse or you'll stop", w / 2, 92);
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(w / 2 - 90, 104, 180, 8);
        ctx.fillStyle = "#ffd24a";
        ctx.fillRect(w / 2 - 90, 104, 180 * t, 8);
        ctx.textAlign = "left";
      }
    }

    if (state.mode === "title" || state.mode === "dead") {
      ctx.fillStyle = "rgba(6,2,20,0.45)";
      ctx.fillRect(0, 0, w, h);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff4d2";
      ctx.font = "800 40px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("SLOPEYBALLS", w / 2, 56);
      ctx.font = "15px ui-sans-serif, system-ui, sans-serif";
      ctx.fillStyle = "rgba(200,230,255,0.92)";
      if (state.mode === "title") {
        ctx.fillText("Right: spin. Left: reverse. Spend tickets between runs.", w / 2, 86);
        ctx.fillText("Tap to ride", w / 2, 110);
        ctx.textAlign = "left";
      } else {
        ctx.fillText(`Run over. ${state.runMeters} m earned ${Math.max(1, Math.floor(state.runMeters / 8))} tickets.`, w / 2, 84);
        ctx.fillText("Tickets buy a stronger ball. Then ride again.", w / 2, 106);
        ctx.textAlign = "left";
        const bw = Math.min(420, w - 40);
        const bx = (w - bw) / 2;
        let by = 148;
        btn("spin", bx, by, bw, 52, `SPIN  Lv ${up.spin}`, `More torque on the climbs.  ${cost(up.spin)} tickets`, false);
        by += 60;
        btn("grip", bx, by, bw, 52, `GRIP  Lv ${up.grip}`, `Stick to the slope.  ${cost(up.grip)} tickets`, false);
        by += 60;
        btn("mass", bx, by, bw, 52, `MASS  Lv ${up.mass}`, `Heavier. Better downhill.  ${cost(up.mass)} tickets`, false);
        by += 70;
        btn("ride", bx, by, bw, 52, "RIDE AGAIN", "Keep your ball. New hills.", true);
      }
    }
  }

  function draw() {
    ctx.setTransform(view.s, 0, 0, view.s, 0, 0);
    ctx.translate(state.shake * (Math.random() * 2 - 1), state.shake * (Math.random() * 2 - 1));
    drawSky();
    if (pts.length > 2) drawHills();
    for (const p of state.dust) {
      ctx.globalAlpha = Math.max(0, p.life * 2);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x - state.camX, p.y - state.camY, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (state.mode !== "title") drawBall();
    if (state.flash > 0) {
      ctx.fillStyle = `rgba(255,200,120,${state.flash * 0.35})`;
      ctx.fillRect(0, 0, view.cssW, view.cssH);
    }
    drawHud();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function screenPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top, t: (e.clientX - rect.left) / Math.max(1, rect.width) };
  }

  function aimFromEvent(e) {
    const t = screenPos(e).t;
    state.rev = t < 0.3;
    state.hold = !state.rev;
  }

  function down(e) {
    ensureAudio();
    const p = e ? screenPos(e) : null;
    if (state.mode === "title") {
      resetRun();
      beep(520, 0.08, "sine", 0.05);
      if (e) aimFromEvent(e);
      else state.hold = true;
      return;
    }
    if (state.mode === "dead") {
      if (p) {
        const hit = ui.hits.find(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
        if (hit && hit.id === "ride") {
          resetRun();
          beep(520, 0.08, "sine", 0.05);
        } else if (hit && (hit.id === "spin" || hit.id === "grip" || hit.id === "mass")) {
          tryBuy(hit.id);
        }
      } else {
        resetRun();
        beep(520, 0.08, "sine", 0.05);
      }
      return;
    }
    if (e) aimFromEvent(e);
    else state.hold = true;
  }
  function release() { state.hold = false; state.rev = false; }

  canvas.addEventListener("pointerdown", e => { e.preventDefault(); canvas.setPointerCapture(e.pointerId); down(e); });
  canvas.addEventListener("pointermove", e => { if (e.buttons && state.mode === "play") aimFromEvent(e); });
  canvas.addEventListener("pointerup", e => { e.preventDefault(); release(); });
  canvas.addEventListener("pointercancel", release);
  window.addEventListener("keydown", e => {
    if (e.code === "Space" || e.key === "ArrowRight" || e.key === "ArrowUp") {
      e.preventDefault();
      state.rev = false;
      down();
    }
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A" || e.key === "ArrowDown") {
      e.preventDefault();
      ensureAudio();
      if (state.mode === "title") resetRun();
      if (state.mode === "dead") return;
      state.hold = false;
      state.rev = true;
    }
    if ((e.key === "r" || e.key === "R") && state.mode !== "title") resetRun();
    if (e.key === "m" || e.key === "M") {
      state.mute = !state.mute;
      if (state.mute) {
        setHum(false);
        if (music) music.stop();
      } else if (audioCtx) startMusic();
    }
  });
  window.addEventListener("keyup", e => {
    if (e.code === "Space" || e.key === "ArrowRight" || e.key === "ArrowUp") state.hold = false;
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A" || e.key === "ArrowDown") state.rev = false;
  });
  document.addEventListener("visibilitychange", () => {
    state.hidden = document.hidden;
    if (document.hidden) {
      state.hold = false;
      state.rev = false;
      setHum(false);
    } else last = performance.now();
  });

  window.addEventListener("resize", layout);
  buildStart(1);
  layout();
  state.camY = heightAt(90) - view.cssH * 0.58;
  state.horizonY = heightAt(90) - state.camY;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
