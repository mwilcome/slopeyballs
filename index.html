  /* ── Kernel ─────────────────────────────────────────────── */
  const Kernel = (() => {
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const bus = {
      _h: Object.create(null),
      on(ev, fn) {
        (this._h[ev] || (this._h[ev] = [])).push(fn);
      },
      emit(ev, payload) {
        const list = this._h[ev];
        if (list) for (const fn of list) fn(payload);
      }
    };
    const view = { w: 1, h: 1, s: 1 };
    let mute = false;

    function layout() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      view.w = w;
      view.h = h;
      view.s = dpr;
    }

    function setMute(v) {
      mute = !!v;
      bus.emit("mute", mute);
    }

    window.addEventListener("resize", layout);
    layout();

    return {
      canvas, ctx, bus, view,
      isMute() { return mute; },
      setMute,
      layout
    };
  })();

  /* ── Progression (save only; shop UI lives in Menus) ───── */
  const Progression = (() => {
    const KEY = "slopeyballs-save";
    const CAP = 5;
    const empty = () => ({ jump: 1, glide: 1, speed: 1, tickets: 0, best: 0 });

    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) || "{}");
        return { ...empty(), ...raw, jump: raw.jump || 1, glide: raw.glide || 1, speed: raw.speed || 1 };
      } catch {
        return empty();
      }
    }

    let data = load();

    function save() {
      localStorage.setItem(KEY, JSON.stringify(data));
    }

    function cost(level) {
      return 20 * level * level;
    }

    function snapshot() {
      return { ...data, cap: CAP, nextCost: { jump: cost(data.jump), glide: cost(data.glide), speed: cost(data.speed) } };
    }

    function buy(stat) {
      if (!Object.prototype.hasOwnProperty.call(data, stat)) return false;
      if (data[stat] >= CAP) return false;
      const c = cost(data[stat]);
      if (data.tickets < c) return false;
      data.tickets -= c;
      data[stat] += 1;
      save();
      Kernel.bus.emit("progressed", snapshot());
      return true;
    }

    function resetAll() {
      data = empty();
      save();
      Kernel.bus.emit("progressed", snapshot());
    }

    function recordRun({ distance, finished }) {
      const meters = Math.max(0, distance | 0);
      const earned = Math.max(1, Math.floor(meters / 40)) + (finished ? 50 : 0);
      data.tickets += earned;
      if (meters > data.best) data.best = meters;
      save();
      Kernel.bus.emit("progressed", snapshot());
      return { distance: meters, earned, finished: !!finished, tickets: data.tickets, best: data.best };
    }

    return { snapshot, buy, resetAll, recordRun, cost, CAP };
  })();

      const a = Math.max(0.2, Math.min(0.8, skew || 0.3));
      const crest = 0.07;
      if (t <= 0 || t >= 1) return 0;
      if (t < a - crest) return t / (a - crest);
      if (t < a + crest) return 1;
      const u = (t - a - crest) / (1 - a - crest);
      return Math.max(0, 1 - u * u);

      if (local < 0 || local > b.w) return null;
      const eave = eaveY(b);
      const peak = b.peak;
      if (b.roof === "dune" || b.kind === "dune") {
        return eave - peak * duneBump(local / b.w, b.skew);
      }
      if (b.roof === "peak") {
        const mid = b.w / 2;
        const t = local < mid ? local / mid : (b.w - local) / mid;
        return eave - peak * t;
      }
      if (b.roof === "ramp-right") return eave - peak * (local / b.w);
      if (b.roof === "ramp-left") return eave - peak * (1 - local / b.w);

      for (let i = 0; i < list.length; i++) {

  /* ── Ball ───────────────────────────────────────────────── */
  const Ball = (() => {
    const R = 22;
    const GRAVITY = 2450;
    const intent = { roll: 0, jumpHeld: false };

    const LAND = 22;
    const COYOTE = 0.12;
    let x = 80, y = 200, vx = 0, vy = 0;
    let spin = 0, grounded = false, charging = false, charge = 0;
    let meter = 1, startX = 80, alive = true, glidingNow = false, glideLocked = false;
    let coyote = 0;

    function stats() { return Progression.snapshot(); }

    function accel() {
      const s = stats().speed;
      return 1520 + s * 400;
    }
    function maxVx() {
      return 185 + stats().speed * 75;
    }
    function airSteer() {
      return accel() * (0.38 + stats().speed * 0.08);
    }
    function jumpSpeed() {
      return 630 + stats().jump * 72;
    }
    function riseBleed() {
      return 0.64;
    }
    function boostTerm() {
      const g = stats().glide;
      if (g >= 5) return -200;
      if (g >= 4) return -120;
      if (g >= 3) return -65;
      if (g >= 2) return 55;
      return 210;
    }

    function spawn() {
      const list = Buildings.buildings();
      const b = list[0];
      x = b.x + 48;
      y = Buildings.roofYOn(b, x) - R;
      vx = 0;
      vy = 0;
      spin = 0;
      charge = 0;
      charging = false;
      meter = 1;
      grounded = true;
      glidingNow = false;
      glideLocked = false;
      coyote = 0;
      startX = x;
      alive = true;
      Buildings.setCam(x - Kernel.view.w * 0.32, y);
    }

    function setIntent(next) {
      if (next.roll != null) intent.roll = next.roll;
      if (next.jumpHeld != null) {
        if (next.jumpHeld && !intent.jumpHeld && (grounded || coyote > 0)) charging = true;
        intent.jumpHeld = next.jumpHeld;
      }
    }

    function canJump() {
      return charging && (grounded || coyote > 0);
    }

    function releaseJump() {
      if (!alive) return;
      if (canJump()) {
        const t = 0.5 + 0.5 * charge;
        vy = -jumpSpeed() * t;
        vx += intent.roll * 50 * t;
        grounded = false;
        charging = false;
        charge = 0;
        coyote = 0;
        Kernel.bus.emit("jumped", { charge: t });
      }
      intent.jumpHeld = false;
    }

    function resolveWalls() {
      const list = Buildings.buildings();
      const gy = Buildings.groundY();
      for (let i = 0; i < list.length; i++) {
        const b = list[i];
        if (x + R <= b.x || x - R >= b.x + b.w) continue;
        const rx = Math.max(b.x, Math.min(x, b.x + b.w));
        const roof = Buildings.roofYOn(b, rx);
        if (roof == null) continue;
        if (y + R <= roof + LAND) continue;
        if (y - R >= gy) continue;
        const leftDist = Math.abs(x + R - b.x);
        const rightDist = Math.abs(x - R - (b.x + b.w));
        if (leftDist < rightDist) {
          x = b.x - R;
          if (vx > 0) vx = 0;
        } else {
          x = b.x + b.w + R;
          if (vx < 0) vx = 0;
        }
      }
    }

    function die() {
      if (!alive) return;
      alive = false;
      glidingNow = false;
      glideLocked = false;
      Kernel.bus.emit("fell", { distance: Math.max(0, Math.floor((x - startX) / 8)) });
    }

    function update(dt) {
      if (!alive) return;
      const wasGrounded = grounded;
      const roof = Buildings.roofY(x);
      const onRoof = roof != null && y + R >= roof - 2 && y + R <= roof + LAND && vy >= -80;

      if (onRoof && vy >= -10) {
        grounded = true;
        glidingNow = false;
        glideLocked = false;
        if (intent.jumpHeld) charging = true;
        y = roof - R;
        const sl = Buildings.slope(x);
        vy = 0;
        vx += GRAVITY * sl * 0.35 * dt;
        if (intent.roll) {
          const a = accel() * (intent.roll * vx < 0 ? 2.4 : 1);
          vx += intent.roll * a * dt;
        } else if (vx > 0) {
          vx = Math.max(0, vx - 2400 * dt);
        } else if (vx < 0) {
          vx = Math.min(0, vx + 2400 * dt);
        }
        const cap = maxVx();
        if (vx > cap) vx = cap;
        if (vx < -cap) vx = -cap;
        meter = Math.min(1, meter + dt * (0.22 + stats().glide * 0.05));
      } else {
        grounded = false;
        if (!intent.jumpHeld) glideLocked = false;
        const wantGlide = intent.jumpHeld && meter > 0 && !glideLocked;
        if (wantGlide) {
          const term = boostTerm();
          if (vy < 0 && vy < term) {
            vy += GRAVITY * riseBleed() * dt;
          } else {
            if (!glidingNow && vy > term) vy = term + (vy - term) * 0.5;
            vy += (term - vy) * Math.min(1, dt * 5);
          }
          glidingNow = true;
          meter = Math.max(0, meter - dt / (1.15 + stats().glide * 0.28));
          if (meter <= 0) {
            meter = 0;
            glideLocked = true;
            glidingNow = false;
          }
        } else {
          glidingNow = false;
          vy += GRAVITY * dt;
          if (!intent.jumpHeld) {
            meter = Math.min(1, meter + dt * (0.14 + stats().glide * 0.03));
          }
        }
        if (intent.roll) vx += intent.roll * airSteer() * dt;
        const cap = maxVx() * 1.15;
        if (vx > cap) vx = cap;
        if (vx < -cap) vx = -cap;
      }

      if (grounded) coyote = COYOTE;
      else coyote = Math.max(0, coyote - dt);

      if ((grounded || coyote > 0) && charging && intent.jumpHeld) {
        charge = Math.min(1, charge + dt / 0.55);
      } else if (grounded && !intent.jumpHeld) {
        charge = 0;
        charging = false;
      }

      x += vx * dt;
      y += vy * dt;
      spin += vx * dt * 0.045;

      resolveWalls();

      const stillRoof = Buildings.roofY(x);
      if (stillRoof != null && vy >= -10 && y + R >= stillRoof - 2 && y + R <= stillRoof + LAND) {
        y = stillRoof - R;
        vy = 0;
        grounded = true;
        glidingNow = false;
        glideLocked = false;
        if (intent.jumpHeld) charging = true;
      }

      Buildings.setCam(x - Kernel.view.w * 0.32, y);

      if (grounded && !wasGrounded) Kernel.bus.emit("landed");

      const bottom = Buildings.screenY(y + R);
      if (bottom >= Kernel.view.h - 2 || y + R >= Buildings.groundY() - 4) die();
    }

    function snapshot() {
      return {
        x, y, vx, r: R, spin, charge: (grounded || coyote > 0) && charging ? charge : 0, meter, grounded, charging, alive,
        gliding: glidingNow,
        distance: Math.max(0, Math.floor((x - startX) / 8))
      };
    }

    Kernel.bus.on("screen", name => {
      if (name === "playStub") spawn();
    });

    function finish() {
      alive = false;
    }

    return { update, spawn, setIntent, releaseJump, snapshot, finish, R };
  })();

  /* ── Controls ───────────────────────────────────────────── */
  const Controls = (() => {
    const keys = { left: false, right: false, jump: false };

    function playing() {
      return Menus.current() === "playStub";
    }

    function apply() {
      if (!playing()) {
        Ball.setIntent({ roll: 0, jumpHeld: false });
        return;
      }
      const roll = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      Ball.setIntent({ roll, jumpHeld: keys.jump });
    }

    function onKey(e, down) {
      if (!playing()) return;
      const k = e.key;
      if (k === "ArrowLeft" || k === "a" || k === "A") {
        e.preventDefault();
        keys.left = down;
      } else if (k === "ArrowRight" || k === "d" || k === "D") {
        e.preventDefault();
        keys.right = down;
      } else if (k === " " || k === "Spacebar" || e.code === "Space") {
        e.preventDefault();
        if (down && !keys.jump) {
          keys.jump = true;
          Ball.setIntent({ jumpHeld: true });
        }
        if (!down && keys.jump) {
          keys.jump = false;
          Ball.releaseJump();
        }
      } else if (down && (k === "r" || k === "R")) {
        Buildings.load(Menus.selectedMap());
        Ball.spawn();
      }
      apply();
    }

    function pointer(kind, px, py) {
      if (!playing()) return;
      const { w, h } = Kernel.view;
      if (kind === "up" || kind === "cancel") {
        keys.left = false;
        keys.right = false;
        if (keys.jump) {
          keys.jump = false;
          Ball.releaseJump();
        }
        apply();
        return;
      }
      keys.left = px < w * 0.28;
      keys.right = px > w * 0.72;
      const jumpZone = !keys.left && !keys.right;
      if (kind === "down") {
        if (jumpZone) {
          keys.jump = true;
          Ball.setIntent({ jumpHeld: true });
        }
      } else if (kind === "move") {
        if (!jumpZone && keys.jump) {
          keys.jump = false;
          Ball.releaseJump();
        }
      }
      apply();
    }

    window.addEventListener("keydown", e => onKey(e, true));
    window.addEventListener("keyup", e => onKey(e, false));

    function update() { apply(); }

    return { update, pointer };
  })();

  const Look = (() => {

      for (let y = 0; y < h; y += 3) ctx.fillRect(0, y, w, 1);

      const { w, h } = Kernel.view;
      ctx.strokeStyle = "#ff2da8";
      ctx.lineWidth = 12;
      ctx.strokeRect(3, 3, w - 6, h - 6);
      ctx.strokeStyle = "#3cf6ff";
      ctx.shadowColor = "#3cf6ff";
      ctx.shadowBlur = 10;
      ctx.lineWidth = 2.5;

    function drawGridFloor(horizon) {
      const { w, h } = Kernel.view;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, horizon, w, h - horizon);
      ctx.clip();
      ctx.strokeStyle = "rgba(255,45,200,0.28)";
      ctx.lineWidth = 1;
      const vanish = w * 0.5;
      for (let i = -14; i <= 14; i++) {
        ctx.beginPath();
        ctx.moveTo(vanish, horizon);
        ctx.lineTo(vanish + i * (w / 8), h + 40);
        ctx.stroke();

        const u = t / 12;
        const y = horizon + (h - horizon) * u * u;
        ctx.globalAlpha = 0.2 + u * 0.55;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawSky(w, h) {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "#050218");
      g.addColorStop(0.28, "#140560");
      g.addColorStop(0.5, "#6b1ad6");
      g.addColorStop(0.68, "#ff4da0");
      g.addColorStop(1, "#1a0820");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      const horizon = h * 0.28;
      ctx.fillStyle = "#cfe9ff";
      for (let i = 0; i < 90; i++) {
        const sx = ((i * 97) % w);
        const sy = (i * 37) % Math.max(40, horizon - 10);
        ctx.globalAlpha = 0.28 + (i % 5) * 0.12;

      ctx.globalAlpha = 1;

      ctx.rect(0, 0, w, horizon);

      const glow = ctx.createRadialGradient(sunX, sunY, 12, sunX, sunY, sunR * 1.7);
      glow.addColorStop(0, "rgba(255,200,80,0.55)");
      glow.addColorStop(0.5, "rgba(255,60,160,0.16)");
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR * 1.7, 0, Math.PI * 2);
      ctx.fill();
      drawBandedSun(sunX, sunY, sunR);
    }

    function drawBandedSun(cx, cy, radius) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.clip();
      const hh = radius * 2;
      for (let i = 0; i < BANDS.length; i++) {
        ctx.fillStyle = BANDS[i];
        ctx.fillRect(cx - radius - 1, cy - radius + (hh * i) / BANDS.length, radius * 2 + 2, hh / BANDS.length + 1);
      }
      ctx.restore();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,240,180,0.55)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawBeachSky(w, h) {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "#1a0628");
      g.addColorStop(0.22, "#6b1238");
      g.addColorStop(0.42, "#ff4a12");
      g.addColorStop(0.58, "#ffb020");
      g.addColorStop(0.72, "#ff7a3c");
      g.addColorStop(1, "#3a0a22");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      const horizon = h * 0.38;
      ctx.fillStyle = "#ffe8b0";
      for (let i = 0; i < 50; i++) {
        const sx = (i * 113) % w;
        const sy = (i * 29) % Math.max(30, horizon - 20);
        ctx.globalAlpha = 0.2 + (i % 4) * 0.1;
        ctx.fillRect(sx, sy, 1, 1);
      }
      ctx.globalAlpha = 1;

      const sunX = w * 0.5, sunY = horizon - 6, sunR = Math.min(130, h * 0.18);
      const glow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, sunR * 1.9);
      glow.addColorStop(0, "rgba(255,220,80,0.7)");
      glow.addColorStop(0.45, "rgba(255,80,20,0.28)");
      glow.addColorStop(1, "rgba(255,40,80,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR * 1.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
      ctx.clip();
      const hh = sunR * 2;
      for (let i = 0; i < BEACH_SUN.length; i++) {
        ctx.fillStyle = BEACH_SUN[i];
        ctx.fillRect(sunX - sunR - 1, sunY - sunR + (hh * i) / BEACH_SUN.length, sunR * 2 + 2, hh / BEACH_SUN.length + 1);
      }
      ctx.restore();
    }

    function drawWater(w, h, gy) {
      const wg = ctx.createLinearGradient(0, gy, 0, h);
      wg.addColorStop(0, "#4ec4d8");
      wg.addColorStop(0.12, "#2a88b8");
      wg.addColorStop(0.4, "#164a88");
      wg.addColorStop(1, "#0a1838");
      ctx.fillStyle = wg;
      ctx.fillRect(0, gy, w, h - gy);

      const cx = w * 0.5;
      const shine = ctx.createLinearGradient(cx, gy, cx, gy + 90);
      shine.addColorStop(0, "rgba(255,200,80,0.35)");
      shine.addColorStop(1, "rgba(255,120,40,0)");
      ctx.fillStyle = shine;
      ctx.beginPath();
      ctx.moveTo(cx - 70, gy);
      ctx.lineTo(cx + 70, gy);
      ctx.lineTo(cx + 18, gy + 88);
      ctx.lineTo(cx - 18, gy + 88);
      ctx.closePath();
      ctx.fill();

      const t = performance.now() / 900;
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 9; i++) {
        const y = gy + 8 + i * ((h - gy) / 12);
        ctx.strokeStyle = i < 3 ? "rgba(255,210,120,0.28)" : "rgba(80,200,255,0.18)";
        ctx.globalAlpha = 0.35 + (i % 3) * 0.1;
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= w; x += 16) {
          ctx.lineTo(x, y + Math.sin(x * 0.025 + t + i) * (3 + i * 0.35));
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function drawShore(w, gy) {
      const sg = ctx.createLinearGradient(0, gy - 10, 0, gy + 10);
      sg.addColorStop(0, "rgba(255,190,90,0)");
      sg.addColorStop(0.45, "rgba(232,150,60,0.7)");
      sg.addColorStop(0.7, "rgba(255,230,180,0.9)");
      sg.addColorStop(1, "rgba(255,255,255,0.35)");
      ctx.fillStyle = sg;
      ctx.fillRect(0, gy - 8, w, 18);
      ctx.fillStyle = "rgba(255,250,230,0.7)";
      ctx.fillRect(0, gy - 1, w, 3);
    }

    function drawPalm(x, y, scale, flip) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(flip ? -scale : scale, scale);
      ctx.fillStyle = "#2a1020";
      ctx.fillRect(-3, -52, 6, 52);
      ctx.fillStyle = "#1a3a18";
      for (let i = 0; i < 5; i++) {
        const a = -1.15 + i * 0.55;
        ctx.beginPath();
        ctx.moveTo(0, -50);
        ctx.quadraticCurveTo(Math.cos(a) * 38, -50 + Math.sin(a) * 10, Math.cos(a) * 44, -38 + Math.sin(a) * 22);
        ctx.quadraticCurveTo(Math.cos(a) * 16, -48, 0, -50);
        ctx.fill();
      }
      ctx.restore();
    }

    function fillRoofMass(b, cam, gy) {
      const poly = Buildings.roofPoly(b);
      ctx.beginPath();
      ctx.moveTo(poly[0][0] - cam, Buildings.screenY(poly[0][1]));
      for (let p = 1; p < poly.length; p++) ctx.lineTo(poly[p][0] - cam, Buildings.screenY(poly[p][1]));
      ctx.lineTo(b.x + b.w - cam, gy);
      ctx.lineTo(b.x - cam, gy);
      ctx.closePath();
    }

    function drawCoastPad(b, cam) {
      const sx = b.x - cam;
      const eave = Buildings.eaveY(b);
      const top = Buildings.screenY(eave);
      const gy = Buildings.screenY(Buildings.groundY());
      const kind = b.kind || (b.roof === "flat" ? "pier" : "dune");
      const poly = Buildings.roofPoly(b);

      if (kind === "pier") {
        ctx.fillStyle = "#3a2214";
        for (let x = sx + 10; x < sx + b.w - 6; x += 26) {
          ctx.fillRect(x, top + 8, 5, gy - top);
          ctx.fillStyle = "rgba(255,255,255,0.55)";
          ctx.beginPath();
          ctx.ellipse(x + 2, gy, 9, 3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#3a2214";
        }
        ctx.fillStyle = "#8a5a28";
        ctx.fillRect(sx, top - 4, b.w, 12);
        ctx.fillStyle = "#c4843c";
        for (let x = 0; x < b.w; x += 10) ctx.fillRect(sx + x, top - 4, 7, 12);
        ctx.strokeStyle = "#ffd24a";
        ctx.lineWidth = 2;
        ctx.shadowColor = "#ff8a20";
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(sx, top);
        ctx.lineTo(sx + b.w, top);
        ctx.stroke();
        ctx.shadowBlur = 0;
        return;
      }

      if (kind === "sand") {
        const sg = ctx.createLinearGradient(sx, top, sx, gy);
        sg.addColorStop(0, "#ffd56a");
        sg.addColorStop(0.55, "#e09040");
        sg.addColorStop(1, "#c06030");
        ctx.fillStyle = sg;
        ctx.fillRect(sx, top, b.w, gy - top);
        ctx.fillStyle = "rgba(180,80,40,0.35)";
        ctx.fillRect(sx, gy - 10, b.w, 10);
        ctx.strokeStyle = "#ffe08a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx, top);
        ctx.lineTo(sx + b.w, top);
        ctx.stroke();
        return;
      }

      fillRoofMass(b, cam, gy);
      if (kind === "cliff") {
        const cg = ctx.createLinearGradient(sx, top, sx, gy);
        cg.addColorStop(0, "#e07030");
        cg.addColorStop(0.45, "#c04018");
        cg.addColorStop(1, "#6a1810");
        ctx.fillStyle = cg;
        ctx.fill();
        ctx.strokeStyle = "rgba(255,200,80,0.25)";
        ctx.lineWidth = 1;
        for (let i = 1; i < 6; i++) {
          const y = top + (gy - top) * (i / 6);
          ctx.beginPath();
          ctx.moveTo(sx + 4, y);
          ctx.lineTo(sx + b.w - 4, y + 3);
          ctx.stroke();
        }
      } else if (kind === "rock") {
        ctx.fillStyle = "#5a3028";
        ctx.fill();
        ctx.fillStyle = "#7a4430";
        ctx.beginPath();
        ctx.moveTo(sx + 8, gy);
        ctx.lineTo(sx + b.w * 0.3, top + 10);
        ctx.lineTo(sx + b.w * 0.6, gy);
        ctx.fill();
      } else {
        const sg = ctx.createLinearGradient(sx, top - 40, sx, gy);
        sg.addColorStop(0, "#ffe08a");
        sg.addColorStop(0.4, "#f0a030");
        sg.addColorStop(0.75, "#d07028");
        sg.addColorStop(1, "#a04820");
        ctx.fillStyle = sg;
        ctx.fill();
        ctx.fillStyle = "rgba(160,60,30,0.35)";
        ctx.fillRect(sx, gy - 14, b.w, 14);
      }

      ctx.beginPath();
      ctx.moveTo(poly[0][0] - cam, Buildings.screenY(poly[0][1]));
      for (let p = 1; p < poly.length; p++) ctx.lineTo(poly[p][0] - cam, Buildings.screenY(poly[p][1]));
      ctx.strokeStyle = kind === "rock" ? "#ffb070" : "#ffe08a";
      ctx.shadowColor = "#ff6a20";
      ctx.shadowBlur = 10;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawMountains(w, horizon) {
      const peaks = [
        [0.0, 28], [0.08, 70], [0.16, 36], [0.24, 110], [0.34, 48],
        [0.42, 88], [0.52, 30], [0.60, 124], [0.70, 54], [0.78, 92],
        [0.88, 40], [0.96, 76], [1.0, 34]
      ];
      ctx.beginPath();
      ctx.moveTo(0, Kernel.view.h);
      ctx.lineTo(0, horizon + 40);
      for (const [u, hh] of peaks) ctx.lineTo(w * u, horizon - hh);
      ctx.lineTo(w, horizon + 80);
      ctx.lineTo(w, Kernel.view.h);
      ctx.closePath();
      const g = ctx.createLinearGradient(0, horizon - 130, 0, horizon + 90);
      g.addColorStop(0, "#1a0830");
      g.addColorStop(0.55, "#0c0418");
      g.addColorStop(1, "#070218");
      ctx.fillStyle = g;
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, horizon + 40);
      for (const [u, hh] of peaks) ctx.lineTo(w * u, horizon - hh);
      ctx.strokeStyle = "rgba(255,45,200,0.28)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function drawAsphaltFloor(w, h, gy) {
      const g = ctx.createLinearGradient(0, gy, 0, h);
      g.addColorStop(0, "#2a2438");
      g.addColorStop(0.18, "#1a1428");
      g.addColorStop(1, "#080510");
      ctx.fillStyle = g;
      ctx.fillRect(0, gy, w, Math.max(0, h - gy));
      ctx.strokeStyle = "rgba(255,210,80,0.22)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, gy + 3);
      ctx.lineTo(w, gy + 3);
      ctx.stroke();
    }

    function drawHighwayPad(b, cam) {
      const sx = b.x - cam;
      const eave = Buildings.eaveY(b);
      const top = Buildings.screenY(eave);
      const gy = Buildings.screenY(Buildings.groundY());
      const poly = Buildings.roofPoly(b);
      const hue = b.hue || 280;
      const kind = b.kind || "road";
      const deckH = 16;

      if (kind === "overpass" || b.h > 140) {
        ctx.fillStyle = "#16101c";
        for (let x = sx + 18; x < sx + b.w - 10; x += 56) {
          ctx.fillRect(x, top + 8, 10, Math.max(0, gy - top - 8));
        }
      } else {
        ctx.fillStyle = "#1a1522";
        ctx.fillRect(sx + 4, top, b.w - 8, Math.max(0, gy - top));
      }

      ctx.beginPath();
      ctx.moveTo(poly[0][0] - cam, Buildings.screenY(poly[0][1]));
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0] - cam, Buildings.screenY(poly[i][1]));
      ctx.lineTo(poly[poly.length - 1][0] - cam, Buildings.screenY(poly[poly.length - 1][1]) + deckH);
      ctx.lineTo(poly[0][0] - cam, Buildings.screenY(poly[0][1]) + deckH);
      ctx.closePath();
      ctx.fillStyle = "#2a2834";
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(poly[0][0] - cam, Buildings.screenY(poly[0][1]));
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0] - cam, Buildings.screenY(poly[i][1]));
      ctx.strokeStyle = `hsl(${hue} 90% 65%)`;
      ctx.shadowColor = `hsl(${hue} 100% 60%)`;
      ctx.shadowBlur = 10;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.save();
      ctx.strokeStyle = "#ffd24a";
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 14]);
      ctx.beginPath();
      ctx.moveTo(poly[0][0] - cam, Buildings.screenY(poly[0][1]) + 2);
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0] - cam, Buildings.screenY(poly[i][1]) + 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawBall(snap, cam) {
      const x = snap.x - cam;
      const y = Buildings.screenY(snap.y);
      const squash = snap.charge || 0;
      const sx = 1 + squash * 0.16;
      const sy = 1 - squash * 0.22;
      const glow = ctx.createRadialGradient(x, y, 4, x, y, snap.gliding ? 48 : 38);
      if (snap.gliding) {
        glow.addColorStop(0, "rgba(120,255,255,0.55)");
        glow.addColorStop(0.45, "rgba(80,180,255,0.22)");
        glow.addColorStop(1, "rgba(80,180,255,0)");
      } else {
        glow.addColorStop(0, `rgba(255,200,80,${0.4 + squash * 0.35})`);
        glow.addColorStop(0.5, "rgba(255,60,160,0.18)");
        glow.addColorStop(1, "rgba(255,60,160,0)");
      }
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.ellipse(x, y + BALL_R * (1 - sy) * 0.5, 36 * sx, 36 * sy, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(x, y + BALL_R * (1 - sy) * 0.35);
      ctx.scale(sx, sy);
      ctx.beginPath();
      ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
      ctx.clip();
      const hh = BALL_R * 2;
      for (let i = 0; i < BANDS.length; i++) {
        ctx.fillStyle = BANDS[i];
        ctx.fillRect(-BALL_R - 1, -BALL_R + (hh * i) / BANDS.length, BALL_R * 2 + 2, hh / BANDS.length + 1);
      }
      if (squash > 0.02) {
        const fillH = BALL_R * 2 * squash;
        const cg = ctx.createLinearGradient(0, BALL_R - fillH, 0, BALL_R);
        cg.addColorStop(0, "rgba(255,244,210,0.2)");
        cg.addColorStop(0.4, "rgba(60,246,255,0.78)");
        cg.addColorStop(1, "rgba(255,210,74,0.95)");
        ctx.fillStyle = cg;
        ctx.fillRect(-BALL_R - 1, BALL_R - fillH, BALL_R * 2 + 2, fillH + 1);
        ctx.fillStyle = "rgba(255,255,240,0.7)";
        ctx.fillRect(-BALL_R, BALL_R - fillH - 1, BALL_R * 2, 2);
      }
      const shade = ctx.createRadialGradient(-BALL_R * 0.35, -BALL_R * 0.4, BALL_R * 0.1, 0, 0, BALL_R);
      shade.addColorStop(0, "rgba(255,255,255,0.28)");
      shade.addColorStop(0.35, "rgba(255,255,255,0)");
      shade.addColorStop(1, "rgba(30,0,50,0.45)");
      ctx.fillStyle = shade;
      ctx.fillRect(-BALL_R, -BALL_R, BALL_R * 2, BALL_R * 2);
      const ang = snap.spin || 0;
      const hx = Math.sin(ang) * BALL_R * 0.38;
      const hy = -BALL_R * 0.28;
      const depth = 0.45 + 0.55 * Math.max(0, Math.cos(ang));
      const spec = ctx.createRadialGradient(hx, hy, 0, hx, hy, BALL_R * 0.55);
      spec.addColorStop(0, `rgba(255,255,240,${0.12 + depth * 0.4})`);
      spec.addColorStop(0.4, "rgba(255,200,120,0.08)");
      spec.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = spec;
      ctx.beginPath();
      ctx.arc(hx, hy, BALL_R * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.ellipse(x, y + BALL_R * (1 - sy) * 0.35, BALL_R * sx, BALL_R * sy, 0, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,245,200,0.85)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawBuilding(b, cam) {
      const sx = b.x - cam;
      const hue = b.hue || 250;
      const eave = Buildings.eaveY(b);
      const top = Buildings.screenY(eave);
      ctx.fillStyle = `hsl(${hue} 38% 38%)`;
      ctx.fillRect(sx, top, b.w, b.h);
      const shade = ctx.createLinearGradient(sx, top, sx + b.w, top);
      shade.addColorStop(0, "rgba(255,120,220,0.12)");
      shade.addColorStop(0.5, "rgba(0,0,0,0)");
      shade.addColorStop(1, "rgba(20,40,90,0.28)");
      ctx.fillStyle = shade;
      ctx.fillRect(sx, top, b.w, b.h);
      ctx.strokeStyle = `hsl(${hue} 70% 68%)`;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(sx, top, b.w, b.h);

      const cols = Math.max(2, Math.floor(b.w / 28));
      const rows = Math.max(2, Math.floor(b.h / 36));
      const padX = 10, padY = 12;
      const cw = (b.w - padX * 2) / cols;
      const ch = (b.h - padY * 2 - 8) / rows;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const on = (r + c + (b.x | 0)) % 5 !== 0;
          ctx.fillStyle = on ? "rgba(180,230,255,0.9)" : "rgba(40,20,70,0.55)";
          ctx.fillRect(sx + padX + c * cw + 4, top + padY + r * ch + 4, Math.max(6, cw - 8), Math.max(8, ch - 8));
        }
      }

      const poly = Buildings.roofPoly(b);
      ctx.beginPath();
      ctx.moveTo(poly[0][0] - cam, Buildings.screenY(poly[0][1]));
      for (let p = 1; p < poly.length; p++) ctx.lineTo(poly[p][0] - cam, Buildings.screenY(poly[p][1]));
      ctx.closePath();
      ctx.fillStyle = `hsl(${hue} 45% 28%)`;
      ctx.fill();
      ctx.strokeStyle = "#3cf6ff";
      ctx.shadowColor = "#3cf6ff";
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(poly[0][0] - cam, Buildings.screenY(poly[0][1]));
      for (let p = 1; p < poly.length; p++) ctx.lineTo(poly[p][0] - cam, Buildings.screenY(poly[p][1]));
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawHud(snap) {
      const { w, h } = Kernel.view;
      const barH = 44;
      const y0 = h - barH - 12;
      ctx.fillStyle = "rgba(6,2,20,0.72)";
      ctx.fillRect(12, y0, w - 24, barH);

      ctx.font = `800 22px ${FACE}`;
      ctx.fillStyle = "#fff4d2";
      ctx.fillText(`${snap.distance} M`, 24, y0 + 30);

      const mw = Math.min(168, Math.max(96, w * 0.22));
      const mx = w - mw - 28;
      ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
      ctx.fillStyle = snap.gliding ? "#9cffff" : "rgba(214,247,255,0.7)";
      ctx.fillText("FUEL", mx, y0 + 16);
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(mx, y0 + 22, mw, 10);
      ctx.fillStyle = snap.gliding ? "#9cffff" : snap.meter > 0.25 ? "#5cf0ff" : "#ffd24a";
      ctx.fillRect(mx, y0 + 22, mw * snap.meter, 10);
    }

    function drawPlay() {
      const { w, h } = Kernel.view;
      const cam = Buildings.camX();
      const snap = Ball.snapshot();
      const mapId = Buildings.id();
      const beach = mapId === "coast";
      const highway = mapId === "highway";
      if (beach) drawBeachSky(w, h);
      else drawSky(w, h);
      if (highway) drawMountains(w, h * 0.40);
      const gy = Buildings.screenY(Buildings.groundY());
      if (beach) {
        drawWater(w, h, gy);
        drawShore(w, gy);
      } else if (highway) {
        drawAsphaltFloor(w, h, gy);
      } else {
        ctx.fillStyle = "#0a0614";
        ctx.fillRect(0, gy, w, h);
        drawGridFloor(gy);
      }

      const list = Buildings.buildings();
      if (beach) {
        for (let i = 0; i < list.length; i++) {
          const b = list[i];
          if (b.kind !== "pier") continue;
          if (b.x + b.w < cam - 40 || b.x > cam + w + 40) continue;
          drawPalm(b.x - cam - 16, gy, 1.05, false);
          drawPalm(b.x + b.w - cam + 14, gy, 0.9, true);
        }
      }
      for (let i = 0; i < list.length; i++) {
        const b = list[i];
        if (b.x + b.w < cam - 30 || b.x > cam + w + 30) continue;
        if (beach) drawCoastPad(b, cam);
        else if (highway) drawHighwayPad(b, cam);
        else drawBuilding(b, cam);
      }

      drawBall(snap, cam);
      Goal.draw();
      drawScanlines();
      drawHud(snap);

  const Goal = (() => {
    const ctx = Kernel.ctx;
    const BANDS = ["#fff6a8", "#ffe14a", "#ffb02e", "#ff7a3c", "#ff4da0", "#ff2d88", "#c42cff", "#6b1ad6"];
    let claimed = false;

    function reset() { claimed = false; }

    function disc() {
      const g = Buildings.gate();
      return { x: g.x, y: g.y - 52, r: 32 };
    }

    function update() {
      if (claimed || Menus.current() !== "playStub") return;
      const s = Ball.snapshot();
      if (!s.alive) return;
      const d = disc();
      if (Math.hypot(s.x - d.x, s.y - d.y) < d.r + s.r * 0.35) {
        claimed = true;
        Ball.finish();
        Kernel.bus.emit("finished", { distance: s.distance });
      }
    }

    function draw() {
      const cam = Buildings.camX();
      const g = Buildings.gate();
      const d = disc();
      const x = d.x - cam;
      const y = Buildings.screenY(d.y);
      const roof = Buildings.screenY(g.y);
      const beach = Buildings.theme() === "coast";
      if (beach) {
        ctx.fillStyle = "#4a2818";
        ctx.fillRect(x - 38, roof - 8, 8, 8);
        ctx.fillRect(x + 30, roof - 8, 8, 8);
        ctx.fillStyle = "#c4843c";
        ctx.fillRect(x - 36, y + 10, 6, roof - y - 10);
        ctx.fillRect(x + 32, y + 10, 6, roof - y - 10);
        ctx.fillStyle = "#e07030";
        ctx.fillRect(x - 44, y + 8, 90, 10);
        ctx.fillStyle = "#ffb020";
        ctx.beginPath();
        ctx.moveTo(x - 48, y + 8);
        ctx.lineTo(x, y - 10);
        ctx.lineTo(x + 48, y + 8);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#ffe08a";
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.fillStyle = "#2a1458";
        ctx.strokeStyle = "#ffd24a";
        ctx.lineWidth = 3;
        ctx.fillRect(x - 40, y, 10, roof - y);
        ctx.fillRect(x + 30, y, 10, roof - y);
        ctx.strokeRect(x - 40, y, 10, roof - y);
        ctx.strokeRect(x + 30, y, 10, roof - y);
      }
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, d.r, 0, Math.PI * 2);
      ctx.clip();
      const hh = d.r * 2;
      for (let i = 0; i < BANDS.length; i++) {
        ctx.fillStyle = BANDS[i];
        ctx.fillRect(x - d.r - 1, y - d.r + (hh * i) / BANDS.length, d.r * 2 + 2, hh / BANDS.length + 1);
      }
      ctx.restore();
      ctx.beginPath();
      ctx.arc(x, y, d.r, 0, Math.PI * 2);
      ctx.strokeStyle = claimed ? "#5cf0ff" : "rgba(255,240,180,0.9)";
      ctx.shadowColor = "#ffd24a";
      ctx.shadowBlur = 16;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    Kernel.bus.on("screen", name => {
      if (name === "playStub") reset();
    });

    return { update, draw, reset };
  })();

  const Menus = (() => {

      hits.push({ id, x, y, w, h });
    }

    function hitAt(px, py) {
      for (let i = hits.length - 1; i >= 0; i--) {
        const b = hits[i];
        if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b.id;
      }
      return null;
    }

    function drawBackdrop() {
      const { w, h } = Kernel.view;
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "#050218");
      g.addColorStop(0.4, "#1a0670");
      g.addColorStop(0.7, "#7a1ad0");
      g.addColorStop(1, "#120436");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      const sunX = w * 0.5, sunY = h * 0.22, sunR = Math.min(120, h * 0.16);
      ctx.save();
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
      ctx.clip();
      const bh = sunR * 2;
      for (let i = 0; i < BANDS.length; i++) {
        ctx.fillStyle = BANDS[i];
        ctx.fillRect(sunX - sunR - 1, sunY - sunR + (bh * i) / BANDS.length, sunR * 2 + 2, bh / BANDS.length + 1);
      }
      ctx.restore();
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,240,180,0.5)";
      ctx.lineWidth = 2;
      ctx.stroke();

      const horizon = h * 0.42;
      ctx.strokeStyle = "rgba(255,45,200,0.28)";
      ctx.lineWidth = 1;
      for (let i = -16; i <= 16; i++) {

      ctx.moveTo(0, horizon);

        const hh = 18 + ((i * 17) % 7) * 14 + (i % 3) * 10;

        ctx.lineTo(x + w / 36, horizon - hh * 0.55);

      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(60,246,255,0.25)";
      ctx.stroke();

      ctx.strokeStyle = "rgba(180,140,255,0.45)";

      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x, y, w, h);
    }

    function button(id, x, y, w, h, label, sub, hot) {
      addHit(id, x, y, w, h);
      const blink = hot && Math.sin(performance.now() / 160) > 0;
      ctx.fillStyle = hot ? "rgba(255,80,180,0.28)" : "rgba(20,8,48,0.72)";
      ctx.strokeStyle = hot ? (blink ? "#fff4d2" : "#3cf6ff") : "#ff2da8";
      ctx.lineWidth = hot ? 3 : 2;
      ctx.shadowColor = hot ? "#3cf6ff" : "#ff2da8";
      ctx.shadowBlur = hot ? 12 : 6;
      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x, y, w, h);
      ctx.shadowBlur = 0;
      if (hot) {
        ctx.fillStyle = "#3cf6ff";
        ctx.beginPath();
        ctx.moveTo(x + 10, y + h / 2 - 7);
        ctx.lineTo(x + 22, y + h / 2);
        ctx.lineTo(x + 10, y + h / 2 + 7);
        ctx.fill();
      }
      ctx.fillStyle = "#fff4d2";
      ctx.font = `700 18px ${FACE}`;
      ctx.textAlign = "left";
      ctx.fillText(hot ? "▶  " + label.toUpperCase() : label.toUpperCase(), x + (hot ? 28 : 16), y + 24);
      if (sub) {
        ctx.fillStyle = "rgba(180,230,255,0.8)";
        ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
        ctx.fillText(sub, x + (hot ? 28 : 16), y + 44);
      }
    }

    function title(text, y) {
      const { w } = Kernel.view;
      ctx.save();
      ctx.textAlign = "center";
      ctx.font = `italic 800 52px ${FACE}`;
      ctx.fillStyle = "#ff2da8";
      ctx.fillText(text, w / 2 + 4, y + 4);
      ctx.fillStyle = "#3cf6ff";
      ctx.shadowColor = "#3cf6ff";
      ctx.shadowBlur = 18;
      ctx.fillText(text, w / 2, y);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,244,210,0.85)";
      ctx.lineWidth = 1.5;
      ctx.strokeText(text, w / 2, y);
      ctx.restore();
    }

    function subtitle(text, y) {
      const { w } = Kernel.view;
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(200,230,255,0.9)";
      ctx.font = "15px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(text, w / 2, y);
      ctx.textAlign = "left";
    }

    function drawBezel() {
      const { w, h } = Kernel.view;
      ctx.fillStyle = "rgba(6,2,20,0.82)";
      ctx.fillRect(14, h - 52, w - 28, 36);
      ctx.strokeStyle = "rgba(255,45,200,0.55)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(14, h - 52, w - 28, 36);
      ctx.textAlign = "center";
      ctx.font = `700 13px ${FACE}`;
      ctx.fillStyle = "#3cf6ff";
      ctx.fillText("ROOFTOP PLATFORMER", w / 2, h - 38);
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillStyle = "rgba(255,244,210,0.88)";
      ctx.fillText("HOLD SPACE TO CHARGE  ·  HOLD IN AIR TO BOOST  ·  ← → ROLL", w / 2, h - 22);
      ctx.textAlign = "left";
    }

    function drawTitleStats() {
      const { w, h } = Kernel.view;
      const p = Progression.snapshot();
      const bw = Math.min(420, w - 40);
      const bx = (w - bw) / 2;
      const by = Math.max(h * 0.50, 250) - 78;
      ctx.fillStyle = "rgba(8,2,28,0.7)";
      ctx.strokeStyle = "rgba(60,246,255,0.45)";
      ctx.lineWidth = 1.5;
      ctx.fillRect(bx, by, bw, 64);
      ctx.strokeRect(bx, by, bw, 64);
      function pips(label, lv, x) {
        ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
        ctx.fillStyle = "#3cf6ff";
        ctx.fillText(label, x, by + 20);
        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = i < lv ? "#ffd24a" : "rgba(255,255,255,0.12)";
          ctx.fillRect(x + i * 12, by + 28, 10, 12);
        }
      }
      pips("JUMP", p.jump, bx + 16);
      pips("BOOST", p.glide, bx + 110);
      pips("SPEED", p.speed, bx + 204);
      ctx.textAlign = "right";
      ctx.fillStyle = "#fff4d2";
      ctx.font = `700 14px ${FACE}`;
      ctx.fillText(`TIX ${p.tickets}`, bx + bw - 14, by + 24);
      ctx.fillStyle = "rgba(214,247,255,0.8)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(`BEST ${p.best}`, bx + bw - 14, by + 46);
      ctx.textAlign = "left";
    }

    function drawMain() {
      const { w, h } = Kernel.view;
      title("SLOPEYBALLS", 62);
      const bw = Math.min(420, w - 40);
      const bx = (w - bw) / 2;
      let by = Math.max(h * 0.50, 250);
      drawTitleStats();
      button("play", bx, by, bw, 56, "Play", "Choose a map", true);
      by += 66;
      button("mute", bx, by, bw, 56, Kernel.isMute() ? "Sound: Off" : "Sound: On", "Toggle mute", false);
      by += 66;
      button("reset", bx, by, bw, 56, "Reset progress", "Erases upgrades and tickets", false);
    }

    function drawMaps() {
      const { w, h } = Kernel.view;
      title("SELECT MAP", 62);
      const bw = Math.min(420, w - 40);
      const bx = (w - bw) / 2;
      let by = Math.max(h * 0.46, 200);
      for (const map of Buildings.listMaps()) {
        button("map:" + map.id, bx, by, bw, 56, map.name, map.blurb, map.id === pickedMap);
        by += 66;
      }
      button("back", bx, by + 8, bw, 56, "Back", "", false);
    }

    function drawResetConfirm() {
      const { w, h } = Kernel.view;
      title("RESET ALL?", 62);
      const bw = Math.min(420, w - 40);
      const bx = (w - bw) / 2;
      const by = h * 0.5;
      subtitle("This wipes JUMP, BOOST, SPEED, tickets, and bests.", by - 28);
      button("erase", bx, by, bw, 56, "Erase everything", "Cannot be undone", false);
      button("cancel", bx, by + 66, bw, 56, "Cancel", "", true);
    }

    function drawPlayChrome() {
      button("pause", 16, 16, 100, 40, "Pause", "", false);
    }

    function drawPause() {
      const { w, h } = Kernel.view;
      ctx.fillStyle = "rgba(6,2,20,0.55)";
      ctx.fillRect(0, 0, w, h);
      title("PAUSED", 62);
      const bw = Math.min(420, w - 40);
      const bx = (w - bw) / 2;
      let by = h * 0.4;
      button("resume", bx, by, bw, 56, "Resume", "", true);
      by += 66;
      button("restart", bx, by, bw, 56, "Restart map", "Keep upgrades", false);
      by += 66;
      button("menu", bx, by, bw, 56, "Main menu", "", false);
    }

    function drawUpgrade() {
      const { w, h } = Kernel.view;
      const p = Progression.snapshot();
      title(lastRun.finished ? "SUN GATE" : "FELL", 58);
      const bw = Math.min(440, w - 40);
      const bx = (w - bw) / 2;
      let by = Math.max(h * 0.36, 200);
      subtitle(
        `${lastRun.distance} M   ·   +${lastRun.earned} TIX   ·   BEST ${p.best}`,
        by - 10
      );
      const rows = [
        ["jump", "JUMP", "Charge higher on the roof"],
        ["glide", "GLIDE", "Hold jump in air to boost"],
        ["speed", "SPEED", "Roll harder left and right"]
      ];
      for (const [id, label, blurb] of rows) {
        const lv = p[id];
        const maxed = lv >= p.cap;
        const c = p.nextCost[id];
        const sub = maxed ? `${blurb}.  MAX` : `${blurb}.  Lv ${lv} → ${c} tickets`;
        button("buy:" + id, bx, by, bw, 56, `${label}  Lv ${lv}`, sub, false);
        by += 64;
      }
      button("restart", bx, by + 8, bw, 56, "Continue map", "Keep these upgrades", true);
      button("newmap", bx, by + 74, bw, 56, "New map", "Pick a different city", false);
      button("menu", bx, by + 140, bw, 56, "Main menu", "", false);
    }

    function draw() {
      hits = [];
      ctx.setTransform(Kernel.view.s, 0, 0, Kernel.view.s, 0, 0);
      const inWorld = screen === "playStub" || screen === "pause";
      if (inWorld) {
        Look.drawPlay();
        if (screen === "pause") drawPause();
        return;
      }
      drawBackdrop();
      if (screen === "main") drawMain();
      else if (screen === "maps") drawMaps();
      else if (screen === "resetConfirm") drawResetConfirm();
      else if (screen === "upgrade") drawUpgrade();
      drawBezel();
      Look.drawScanlines();
      Look.drawCabinet();
    }

    function onPointer(kind, cx, cy) {
      lastPointer = { kind, x: cx, y: cy };
      if (kind !== "down") return;
      const id = hitAt(cx, cy);
      if (!id) return;
      if (id === "play") go("maps");
      else if (id === "mute") Kernel.setMute(!Kernel.isMute());
      else if (id === "reset") go("resetConfirm");
      else if (id === "back" || id === "cancel") go("main");
      else if (id === "erase") {
        Progression.resetAll();
        go("main");
      } else if (id.startsWith("map:")) {
        pickedMap = id.slice(4);
        Buildings.load(pickedMap);
        go("playStub");
      } else if (id === "pause") go("pause");
      else if (id === "resume") go("playStub");
      else if (id === "restart") {
        Buildings.load(pickedMap);
        Ball.spawn();
        go("playStub");
      }
      else if (id === "newmap") go("maps");
      else if (id === "menu") go("main");
      else if (id.startsWith("buy:")) Progression.buy(id.slice(4));
    }

    function onKey(e) {
      if (e.key === "Escape" || e.key === "p" || e.key === "P") {
        if (screen === "playStub") go("pause");
        else if (screen === "pause") go("playStub");
        else if (screen === "maps" || screen === "resetConfirm" || screen === "upgrade") go("main");
      }
    }

    function pointerFromEvent(e) {
      const rect = Kernel.canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    Kernel.canvas.addEventListener("pointerdown", e => {
      e.preventDefault();
      AudioFx.ensure();
      Kernel.canvas.setPointerCapture(e.pointerId);
      const p = pointerFromEvent(e);
      onPointer("down", p.x, p.y);
      if (screen === "playStub" && !hitAt(p.x, p.y)) Controls.pointer("down", p.x, p.y);
    });
    Kernel.canvas.addEventListener("pointermove", e => {
      if (!e.buttons || screen !== "playStub") return;
      const p = pointerFromEvent(e);
      if (!hitAt(p.x, p.y)) Controls.pointer("move", p.x, p.y);
    });
    Kernel.canvas.addEventListener("pointerup", e => {
      if (screen === "playStub") Controls.pointer("up");
    });
    window.addEventListener("keydown", onKey);

    function endRun(payload, finished) {
      lastRun = Progression.recordRun({ distance: payload && payload.distance, finished });
      go("upgrade");
    }
    Kernel.bus.on("fell", p => endRun(p, false));
    Kernel.bus.on("finished", p => endRun(p, true));

    return { draw, go, current, selectedMap, onPointer };
  })();

  /* ── Shell ──────────────────────────────────────────────── */
  const Shell = (() => {
    let last = performance.now();

    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      Controls.update(dt);
      const screen = Menus.current();
      if (screen === "playStub") {
        Ball.update(dt);
        Goal.update(dt);
      }
      AudioFx.update();
      Menus.draw();
      requestAnimationFrame(frame);
    }

    function start() {
      requestAnimationFrame(frame);
    }

    return { start };
  })();

  Shell.start();
})();
</script>
</body>
</html>
