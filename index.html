<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Slopeyballs</title>
  <meta name="description" content="Rooftop platformer. Charge a jump. Glide. Pick a map.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@PiousProgrammer">
  <meta name="twitter:title" content="Slopeyballs">
  <meta name="twitter:description" content="Rooftop platformer. Charge a jump. Glide. Pick a map.">
  <meta property="og:title" content="Slopeyballs">
  <meta property="og:description" content="Rooftop platformer. Charge a jump. Glide. Pick a map.">
  <meta property="og:url" content="https://mwilcome.github.io/slopeyballs/">
  <meta name="theme-color" content="#12082a">
  <style>
    html, body { margin: 0; height: 100%; background: #070218; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  /* ── Kernel ─────────────────────────────────────────────── */
  const Kernel = (() => {
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const bus = {
      _h: Object.create(null),
      on(ev, fn) {
        (this._h[ev] || (this._h[ev] = [])).push(fn);
      },
      emit(ev, payload) {
        const list = this._h[ev];
        if (list) for (const fn of list) fn(payload);
      }
    };
    const view = { w: 1, h: 1, s: 1 };
    let mute = false;

    function layout() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      view.w = w;
      view.h = h;
      view.s = dpr;
    }

    function setMute(v) {
      mute = !!v;
      bus.emit("mute", mute);
    }

    window.addEventListener("resize", layout);
    layout();

    return {
      canvas, ctx, bus, view,
      isMute() { return mute; },
      setMute,
      layout
    };
  })();

  /* ── Progression (save only; shop UI lives in Menus) ───── */
  const Progression = (() => {
    const KEY = "slopeyballs-save";
    const CAP = 5;
    const empty = () => ({ jump: 1, glide: 1, speed: 1, tickets: 0, best: 0 });

    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) || "{}");
        return { ...empty(), ...raw, jump: raw.jump || 1, glide: raw.glide || 1, speed: raw.speed || 1 };
      } catch {
        return empty();
      }
    }

    let data = load();

    function save() {
      localStorage.setItem(KEY, JSON.stringify(data));
    }

    function cost(level) {
      return 20 * level * level;
    }

    function snapshot() {
      return { ...data, cap: CAP, nextCost: { jump: cost(data.jump), glide: cost(data.glide), speed: cost(data.speed) } };
    }

    function buy(stat) {
      if (!Object.prototype.hasOwnProperty.call(data, stat)) return false;
      if (data[stat] >= CAP) return false;
      const c = cost(data[stat]);
      if (data.tickets < c) return false;
      data.tickets -= c;
      data[stat] += 1;
      save();
      Kernel.bus.emit("progressed", snapshot());
      return true;
    }

    function resetAll() {
      data = empty();
      save();
      Kernel.bus.emit("progressed", snapshot());
    }

    function recordRun({ distance, finished }) {
      const meters = Math.max(0, distance | 0);
      const earned = Math.max(1, Math.floor(meters / 10)) + (finished ? 50 : 0);
      data.tickets += earned;
      if (meters > data.best) data.best = meters;
      save();
      Kernel.bus.emit("progressed", snapshot());
      return { distance: meters, earned, finished: !!finished, tickets: data.tickets, best: data.best };
    }

    return { snapshot, buy, resetAll, recordRun, cost, CAP };
  })();

  /* ── Buildings ──────────────────────────────────────────── */
  const Buildings = (() => {
    const GROUND_Y = 560;

    function pack(id, name, blurb, specs) {
      let x = 40;
      const buildings = specs.map(s => {
        const b = {
          x,
          w: s.w,
          h: s.h,
          roof: s.roof || "flat",
          peak: s.peak == null ? 36 : s.peak,
          hue: s.hue
        };
        x += s.w + (s.gap == null ? 24 : s.gap);
        return b;
      });
      const last = buildings[buildings.length - 1];
      return {
        id, name, blurb, groundY: GROUND_Y, buildings,
        gate: { x: last.x + last.w * 0.5, building: last }
      };
    }

    const BLOCKS = pack("blocks", "Blocks", "Gaps, drops, and a few tall ones. Don't fall.", [
      { w: 280, h: 150, roof: "flat", gap: 80, hue: 250 },
      { w: 150, h: 145, roof: "flat", gap: 64, hue: 270 },
      { w: 160, h: 220, roof: "ramp-right", peak: 52, gap: 96, hue: 220 },
      { w: 170, h: 240, roof: "flat", gap: 156, hue: 290 },
      { w: 130, h: 110, roof: "flat", gap: 44, hue: 240 },
      { w: 130, h: 125, roof: "flat", gap: 56, hue: 260 },
      { w: 190, h: 220, roof: "peak", peak: 36, gap: 92, hue: 210 },
      { w: 120, h: 255, roof: "flat", gap: 198, hue: 280 },
      { w: 160, h: 165, roof: "ramp-left", peak: 38, gap: 86, hue: 230 },
      { w: 110, h: 100, roof: "flat", gap: 38, hue: 300 },
      { w: 110, h: 115, roof: "flat", gap: 42, hue: 245 },
      { w: 150, h: 130, roof: "flat", gap: 120, hue: 255 },
      { w: 200, h: 235, roof: "ramp-right", peak: 70, gap: 70, hue: 265 },
      { w: 150, h: 340, roof: "flat", gap: 64, hue: 215 },
      { w: 140, h: 385, roof: "flat", gap: 60, hue: 275 },
      { w: 220, h: 460, roof: "peak", peak: 48, gap: 104, hue: 285 },
      { w: 150, h: 210, roof: "ramp-left", peak: 42, gap: 88, hue: 235 },
      { w: 180, h: 200, roof: "flat", gap: 58, hue: 295 },
      { w: 120, h: 130, roof: "flat", gap: 128, hue: 248 },
      { w: 170, h: 250, roof: "flat", gap: 160, hue: 218 },
      { w: 150, h: 155, roof: "flat", gap: 46, hue: 268 },
      { w: 130, h: 165, roof: "flat", gap: 46, hue: 258 },
      { w: 190, h: 300, roof: "ramp-right", peak: 50, gap: 42, hue: 228 },
      { w: 140, h: 220, roof: "flat", gap: 214, hue: 278 },
      { w: 180, h: 185, roof: "flat", gap: 80, hue: 238 },
      { w: 160, h: 270, roof: "peak", peak: 42, gap: 92, hue: 288 },
      { w: 200, h: 230, roof: "flat", gap: 40, hue: 242 },
      { w: 170, h: 250, roof: "flat", gap: 48, hue: 262 }
    ]);

    const catalog = [BLOCKS];
    let active = BLOCKS;
    let camX = 0;

    function listMaps() {
      return catalog.map(m => ({ id: m.id, name: m.name, blurb: m.blurb }));
    }
    function getMap(id) { return catalog.find(m => m.id === id) || null; }

    function load(id) {
      active = getMap(id) || BLOCKS;
      camX = 0;
      return active;
    }

    function eaveY(b) { return active.groundY - b.h; }

    function roofYOn(b, wx) {
      const local = wx - b.x;
      if (local < 0 || local > b.w) return null;
      const eave = eaveY(b);
      const peak = b.peak;
      if (b.roof === "peak") {
        const mid = b.w / 2;
        const t = local < mid ? local / mid : (b.w - local) / mid;
        return eave - peak * t;
      }
      if (b.roof === "ramp-right") return eave - peak * (local / b.w);
      if (b.roof === "ramp-left") return eave - peak * (1 - local / b.w);
      return eave;
    }

    function buildingAt(wx) {
      const list = active.buildings;
      for (let i = 0; i < list.length; i++) {
        const b = list[i];
        if (wx >= b.x && wx <= b.x + b.w) return b;
      }
      return null;
    }

    function roofY(wx) {
      const b = buildingAt(wx);
      return b ? roofYOn(b, wx) : null;
    }

    function slope(wx) {
      const a = roofY(wx - 3);
      const b = roofY(wx + 3);
      if (a == null || b == null) return 0;
      return (b - a) / 6;
    }

    function gate() {
      const g = active.gate;
      const y = roofYOn(g.building, g.x);
      return { x: g.x, y };
    }

    function bounds() {
      const list = active.buildings;
      const last = list[list.length - 1];
      return { minX: 0, maxX: last.x + last.w + 200, groundY: active.groundY };
    }

    function setCam(x) {
      const b = bounds();
      const vis = Kernel.view.w;
      camX = Math.max(b.minX, Math.min(x, b.maxX - vis));
    }

    function roofPoly(b) {
      const eave = eaveY(b);
      const x0 = b.x, x1 = b.x + b.w, pk = b.peak;
      if (b.roof === "peak") {
        return [[x0, eave], [x0 + b.w / 2, eave - pk], [x1, eave]];
      }
      if (b.roof === "ramp-right") {
        return [[x0, eave], [x1, eave - pk], [x1, eave]];
      }
      if (b.roof === "ramp-left") {
        return [[x0, eave], [x0, eave - pk], [x1, eave]];
      }
      return [[x0, eave], [x1, eave]];
    }

    function screenY(wy) {
      return wy + (Kernel.view.h - 48) - GROUND_Y;
    }

    return {
      listMaps, getMap, load, roofY, roofYOn, slope, buildingAt, gate, bounds,
      roofPoly, eaveY, screenY,
      groundY() { return active.groundY; },
      buildings() { return active.buildings; },
      camX() { return camX; },
      setCam
    };
  })();

  /* ── Ball ───────────────────────────────────────────────── */
  const Ball = (() => {
    const R = 22;
    const GRAVITY = 2450;
    const intent = { roll: 0, jumpHeld: false };

    const LAND = 22;
    const COYOTE = 0.12;
    let x = 80, y = 200, vx = 0, vy = 0;
    let spin = 0, grounded = false, charging = false, charge = 0;
    let meter = 1, startX = 80, alive = true, glidingNow = false, glideLocked = false;
    let coyote = 0;

    function stats() { return Progression.snapshot(); }

    function accel() {
      const s = stats().speed;
      return 1520 + s * 400;
    }
    function maxVx() {
      return 185 + stats().speed * 75;
    }
    function airSteer() {
      return accel() * (0.38 + stats().speed * 0.08);
    }
    function jumpSpeed() {
      return 630 + stats().jump * 72;
    }
    function riseBleed() {
      return 0.64;
    }
    function boostTerm() {
      const g = stats().glide;
      if (g >= 5) return -200;
      if (g >= 4) return -120;
      if (g >= 3) return -65;
      if (g >= 2) return 55;
      return 210;
    }

    function spawn() {
      const list = Buildings.buildings();
      const b = list[0];
      x = b.x + 48;
      y = Buildings.roofYOn(b, x) - R;
      vx = 0;
      vy = 0;
      spin = 0;
      charge = 0;
      charging = false;
      meter = 1;
      grounded = true;
      glidingNow = false;
      glideLocked = false;
      coyote = 0;
      startX = x;
      alive = true;
    }

    function setIntent(next) {
      if (next.roll != null) intent.roll = next.roll;
      if (next.jumpHeld != null) {
        if (next.jumpHeld && !intent.jumpHeld && (grounded || coyote > 0)) charging = true;
        intent.jumpHeld = next.jumpHeld;
      }
    }

    function canJump() {
      return charging && (grounded || coyote > 0);
    }

    function releaseJump() {
      if (!alive) return;
      if (canJump()) {
        const t = 0.5 + 0.5 * charge;
        vy = -jumpSpeed() * t;
        vx += intent.roll * 50 * t;
        grounded = false;
        charging = false;
        charge = 0;
        coyote = 0;
        Kernel.bus.emit("jumped", { charge: t });
      }
      intent.jumpHeld = false;
    }

    function resolveWalls() {
      const list = Buildings.buildings();
      const gy = Buildings.groundY();
      for (let i = 0; i < list.length; i++) {
        const b = list[i];
        if (x + R <= b.x || x - R >= b.x + b.w) continue;
        const rx = Math.max(b.x, Math.min(x, b.x + b.w));
        const roof = Buildings.roofYOn(b, rx);
        if (roof == null) continue;
        if (y + R <= roof + LAND) continue;
        if (y - R >= gy) continue;
        const leftDist = Math.abs(x + R - b.x);
        const rightDist = Math.abs(x - R - (b.x + b.w));
        if (leftDist < rightDist) {
          x = b.x - R;
          if (vx > 0) vx = 0;
        } else {
          x = b.x + b.w + R;
          if (vx < 0) vx = 0;
        }
      }
    }

    function die() {
      if (!alive) return;
      alive = false;
      glidingNow = false;
      glideLocked = false;
      Kernel.bus.emit("fell", { distance: Math.max(0, Math.floor((x - startX) / 8)) });
    }

    function update(dt) {
      if (!alive) return;
      const wasGrounded = grounded;
      const roof = Buildings.roofY(x);
      const onRoof = roof != null && y + R >= roof - 2 && y + R <= roof + LAND && vy >= -80;

      if (onRoof && vy >= -10) {
        grounded = true;
        glidingNow = false;
        glideLocked = false;
        if (intent.jumpHeld) charging = true;
        y = roof - R;
        const sl = Buildings.slope(x);
        vy = 0;
        vx += GRAVITY * sl * 0.35 * dt;
        if (intent.roll) {
          const a = accel() * (intent.roll * vx < 0 ? 2.4 : 1);
          vx += intent.roll * a * dt;
        } else if (vx > 0) {
          vx = Math.max(0, vx - 2400 * dt);
        } else if (vx < 0) {
          vx = Math.min(0, vx + 2400 * dt);
        }
        const cap = maxVx();
        if (vx > cap) vx = cap;
        if (vx < -cap) vx = -cap;
        meter = Math.min(1, meter + dt * (0.22 + stats().glide * 0.05));
      } else {
        grounded = false;
        if (!intent.jumpHeld) glideLocked = false;
        const wantGlide = intent.jumpHeld && meter > 0 && !glideLocked;
        if (wantGlide) {
          const term = boostTerm();
          if (vy < 0 && vy < term) {
            vy += GRAVITY * riseBleed() * dt;
          } else {
            if (!glidingNow && vy > term) vy = term + (vy - term) * 0.5;
            vy += (term - vy) * Math.min(1, dt * 5);
          }
          glidingNow = true;
          meter = Math.max(0, meter - dt / (1.15 + stats().glide * 0.28));
          if (meter <= 0) {
            meter = 0;
            glideLocked = true;
            glidingNow = false;
          }
        } else {
          glidingNow = false;
          vy += GRAVITY * dt;
          if (!intent.jumpHeld) {
            meter = Math.min(1, meter + dt * (0.14 + stats().glide * 0.03));
          }
        }
        if (intent.roll) vx += intent.roll * airSteer() * dt;
        const cap = maxVx() * 1.15;
        if (vx > cap) vx = cap;
        if (vx < -cap) vx = -cap;
      }

      if (grounded) coyote = COYOTE;
      else coyote = Math.max(0, coyote - dt);

      if ((grounded || coyote > 0) && charging && intent.jumpHeld) {
        charge = Math.min(1, charge + dt / 0.55);
      } else if (grounded && !intent.jumpHeld) {
        charge = 0;
        charging = false;
      }

      x += vx * dt;
      y += vy * dt;
      spin += vx * dt * 0.045;

      resolveWalls();

      const stillRoof = Buildings.roofY(x);
      if (stillRoof != null && vy >= -10 && y + R >= stillRoof - 2 && y + R <= stillRoof + LAND) {
        y = stillRoof - R;
        vy = 0;
        grounded = true;
        glidingNow = false;
        glideLocked = false;
        if (intent.jumpHeld) charging = true;
      }

      Buildings.setCam(x - Kernel.view.w * 0.32);

      if (grounded && !wasGrounded) Kernel.bus.emit("landed");

      const bottom = Buildings.screenY(y + R);
      if (bottom >= Kernel.view.h - 2 || y + R >= Buildings.groundY() - 4) die();
    }

    function snapshot() {
      return {
        x, y, vx, r: R, spin, charge: (grounded || coyote > 0) && charging ? charge : 0, meter, grounded, charging, alive,
        gliding: glidingNow,
        distance: Math.max(0, Math.floor((x - startX) / 8))
      };
    }

    Kernel.bus.on("screen", name => {
      if (name === "playStub") spawn();
    });

    function finish() {
      alive = false;
    }

    return { update, spawn, setIntent, releaseJump, snapshot, finish, R };
  })();

  /* ── Controls ───────────────────────────────────────────── */
  const Controls = (() => {
    const keys = { left: false, right: false, jump: false };

    function playing() {
      return Menus.current() === "playStub";
    }

    function apply() {
      if (!playing()) {
        Ball.setIntent({ roll: 0, jumpHeld: false });
        return;
      }
      const roll = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      Ball.setIntent({ roll, jumpHeld: keys.jump });
    }

    function onKey(e, down) {
      if (!playing()) return;
      const k = e.key;
      if (k === "ArrowLeft" || k === "a" || k === "A") {
        e.preventDefault();
        keys.left = down;
      } else if (k === "ArrowRight" || k === "d" || k === "D") {
        e.preventDefault();
        keys.right = down;
      } else if (k === " " || k === "Spacebar" || e.code === "Space") {
        e.preventDefault();
        if (down && !keys.jump) {
          keys.jump = true;
          Ball.setIntent({ jumpHeld: true });
        }
        if (!down && keys.jump) {
          keys.jump = false;
          Ball.releaseJump();
        }
      } else if (down && (k === "r" || k === "R")) {
        Buildings.load(Menus.selectedMap());
        Ball.spawn();
      }
      apply();
    }

    function pointer(kind, px, py) {
      if (!playing()) return;
      const { w, h } = Kernel.view;
      if (kind === "up" || kind === "cancel") {
        keys.left = false;
        keys.right = false;
        if (keys.jump) {
          keys.jump = false;
          Ball.releaseJump();
        }
        apply();
        return;
      }
      keys.left = px < w * 0.28;
      keys.right = px > w * 0.72;
      const jumpZone = !keys.left && !keys.right;
      if (kind === "down") {
        if (jumpZone) {
          keys.jump = true;
          Ball.setIntent({ jumpHeld: true });
        }
      } else if (kind === "move") {
        if (!jumpZone && keys.jump) {
          keys.jump = false;
          Ball.releaseJump();
        }
      }
      apply();
    }

    window.addEventListener("keydown", e => onKey(e, true));
    window.addEventListener("keyup", e => onKey(e, false));

    function update() { apply(); }

    return { update, pointer };
  })();

  /* ── Look ───────────────────────────────────────────────── */
  const Look = (() => {
    const ctx = Kernel.ctx;
    const BANDS = ["#fff6a8", "#ffe14a", "#ffb02e", "#ff7a3c", "#ff4da0", "#ff2d88", "#c42cff", "#6b1ad6"];
    const BALL_R = 22;
    const FACE = 'Impact, Haettenschweiler, "Arial Black", sans-serif';

    function drawScanlines() {
      const { w, h } = Kernel.view;
      ctx.fillStyle = "rgba(0,0,0,0.16)";
      for (let y = 0; y < h; y += 3) ctx.fillRect(0, y, w, 1);
    }

    function drawCabinet() {
      const { w, h } = Kernel.view;
      ctx.strokeStyle = "#ff2da8";
      ctx.lineWidth = 12;
      ctx.strokeRect(3, 3, w - 6, h - 6);
      ctx.strokeStyle = "#3cf6ff";
      ctx.shadowColor = "#3cf6ff";
      ctx.shadowBlur = 10;
      ctx.lineWidth = 2.5;
      ctx.strokeRect(9, 9, w - 18, h - 18);
      ctx.shadowBlur = 0;
    }

    function drawGridFloor(horizon) {
      const { w, h } = Kernel.view;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, horizon, w, h - horizon);
      ctx.clip();
      ctx.strokeStyle = "rgba(255,45,200,0.28)";
      ctx.lineWidth = 1;
      const vanish = w * 0.5;
      for (let i = -14; i <= 14; i++) {
        ctx.beginPath();
        ctx.moveTo(vanish, horizon);
        ctx.lineTo(vanish + i * (w / 8), h + 40);
        ctx.stroke();
      }
      for (let t = 0; t <= 12; t++) {
        const u = t / 12;
        const y = horizon + (h - horizon) * u * u;
        ctx.globalAlpha = 0.2 + u * 0.55;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawSky(w, h) {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "#050218");
      g.addColorStop(0.28, "#140560");
      g.addColorStop(0.5, "#6b1ad6");
      g.addColorStop(0.68, "#ff4da0");
      g.addColorStop(1, "#1a0820");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      const horizon = h * 0.28;
      ctx.fillStyle = "#cfe9ff";
      for (let i = 0; i < 90; i++) {
        const sx = ((i * 97) % w);
        const sy = (i * 37) % Math.max(40, horizon - 10);
        ctx.globalAlpha = 0.28 + (i % 5) * 0.12;
        ctx.fillRect(sx, sy, i % 7 === 0 ? 2 : 1, i % 7 === 0 ? 2 : 1);
      }
      ctx.globalAlpha = 1;

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, w, horizon);
      ctx.clip();
      ctx.strokeStyle = "rgba(255,45,200,0.28)";
      ctx.lineWidth = 1;
      for (let i = -18; i <= 18; i++) {
        ctx.beginPath();
        ctx.moveTo(w * 0.5, horizon);
        ctx.lineTo(w * 0.5 + i * (w / 10), -20);
        ctx.stroke();
      }
      ctx.restore();

      const sunX = w * 0.5, sunY = horizon - 8, sunR = Math.min(110, h * 0.15);
      const glow = ctx.createRadialGradient(sunX, sunY, 12, sunX, sunY, sunR * 1.7);
      glow.addColorStop(0, "rgba(255,200,80,0.55)");
      glow.addColorStop(0.5, "rgba(255,60,160,0.16)");
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR * 1.7, 0, Math.PI * 2);
      ctx.fill();
      drawBandedSun(sunX, sunY, sunR);
    }

    function drawBandedSun(cx, cy, radius) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.clip();
      const hh = radius * 2;
      for (let i = 0; i < BANDS.length; i++) {
        ctx.fillStyle = BANDS[i];
        ctx.fillRect(cx - radius - 1, cy - radius + (hh * i) / BANDS.length, radius * 2 + 2, hh / BANDS.length + 1);
      }
      ctx.restore();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,240,180,0.55)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawBall(snap, cam) {
      const x = snap.x - cam;
      const y = Buildings.screenY(snap.y);
      const squash = snap.charge || 0;
      const sx = 1 + squash * 0.16;
      const sy = 1 - squash * 0.22;
      const glow = ctx.createRadialGradient(x, y, 4, x, y, snap.gliding ? 48 : 38);
      if (snap.gliding) {
        glow.addColorStop(0, "rgba(120,255,255,0.55)");
        glow.addColorStop(0.45, "rgba(80,180,255,0.22)");
        glow.addColorStop(1, "rgba(80,180,255,0)");
      } else {
        glow.addColorStop(0, `rgba(255,200,80,${0.4 + squash * 0.35})`);
        glow.addColorStop(0.5, "rgba(255,60,160,0.18)");
        glow.addColorStop(1, "rgba(255,60,160,0)");
      }
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.ellipse(x, y + BALL_R * (1 - sy) * 0.5, 36 * sx, 36 * sy, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(x, y + BALL_R * (1 - sy) * 0.35);
      ctx.scale(sx, sy);
      ctx.beginPath();
      ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
      ctx.clip();
      const hh = BALL_R * 2;
      for (let i = 0; i < BANDS.length; i++) {
        ctx.fillStyle = BANDS[i];
        ctx.fillRect(-BALL_R - 1, -BALL_R + (hh * i) / BANDS.length, BALL_R * 2 + 2, hh / BANDS.length + 1);
      }
      const shade = ctx.createRadialGradient(-BALL_R * 0.35, -BALL_R * 0.4, BALL_R * 0.1, 0, 0, BALL_R);
      shade.addColorStop(0, "rgba(255,255,255,0.28)");
      shade.addColorStop(0.35, "rgba(255,255,255,0)");
      shade.addColorStop(1, "rgba(30,0,50,0.45)");
      ctx.fillStyle = shade;
      ctx.fillRect(-BALL_R, -BALL_R, BALL_R * 2, BALL_R * 2);
      const ang = snap.spin || 0;
      const hx = Math.sin(ang) * BALL_R * 0.38;
      const hy = -BALL_R * 0.28;
      const depth = 0.45 + 0.55 * Math.max(0, Math.cos(ang));
      const spec = ctx.createRadialGradient(hx, hy, 0, hx, hy, BALL_R * 0.55);
      spec.addColorStop(0, `rgba(255,255,240,${0.12 + depth * 0.4})`);
      spec.addColorStop(0.4, "rgba(255,200,120,0.08)");
      spec.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = spec;
      ctx.beginPath();
      ctx.arc(hx, hy, BALL_R * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.ellipse(x, y + BALL_R * (1 - sy) * 0.35, BALL_R * sx, BALL_R * sy, 0, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,245,200,0.85)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawBuilding(b, cam) {
      const sx = b.x - cam;
      const hue = b.hue || 250;
      const eave = Buildings.eaveY(b);
      const top = Buildings.screenY(eave);
      ctx.fillStyle = `hsl(${hue} 38% 38%)`;
      ctx.fillRect(sx, top, b.w, b.h);
      const shade = ctx.createLinearGradient(sx, top, sx + b.w, top);
      shade.addColorStop(0, "rgba(255,120,220,0.12)");
      shade.addColorStop(0.5, "rgba(0,0,0,0)");
      shade.addColorStop(1, "rgba(20,40,90,0.28)");
      ctx.fillStyle = shade;
      ctx.fillRect(sx, top, b.w, b.h);
      ctx.strokeStyle = `hsl(${hue} 70% 68%)`;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(sx, top, b.w, b.h);

      const cols = Math.max(2, Math.floor(b.w / 28));
      const rows = Math.max(2, Math.floor(b.h / 36));
      const padX = 10, padY = 12;
      const cw = (b.w - padX * 2) / cols;
      const ch = (b.h - padY * 2 - 8) / rows;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const on = (r + c + (b.x | 0)) % 5 !== 0;
          ctx.fillStyle = on ? "rgba(180,230,255,0.9)" : "rgba(40,20,70,0.55)";
          ctx.fillRect(sx + padX + c * cw + 4, top + padY + r * ch + 4, Math.max(6, cw - 8), Math.max(8, ch - 8));
        }
      }

      const poly = Buildings.roofPoly(b);
      ctx.beginPath();
      ctx.moveTo(poly[0][0] - cam, Buildings.screenY(poly[0][1]));
      for (let p = 1; p < poly.length; p++) ctx.lineTo(poly[p][0] - cam, Buildings.screenY(poly[p][1]));
      ctx.closePath();
      ctx.fillStyle = `hsl(${hue} 45% 28%)`;
      ctx.fill();
      ctx.strokeStyle = "#3cf6ff";
      ctx.shadowColor = "#3cf6ff";
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(poly[0][0] - cam, Buildings.screenY(poly[0][1]));
      for (let p = 1; p < poly.length; p++) ctx.lineTo(poly[p][0] - cam, Buildings.screenY(poly[p][1]));
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawHud(snap) {
      const { w, h } = Kernel.view;
      const p = Progression.snapshot();
      const barH = 44;
      const y0 = h - barH - 12;
      ctx.fillStyle = "rgba(6,2,20,0.82)";
      ctx.fillRect(12, y0, w - 24, barH);
      ctx.strokeStyle = "rgba(60,246,255,0.65)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(12, y0, w - 24, barH);

      ctx.font = `800 22px ${FACE}`;
      ctx.fillStyle = "#fff4d2";
      ctx.fillText(`${snap.distance} M`, 24, y0 + 30);

      function pips(label, lv, x) {
        ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
        ctx.fillStyle = "#3cf6ff";
        ctx.fillText(label, x, y0 + 16);
        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = i < lv ? "#ffd24a" : "rgba(255,255,255,0.12)";
          ctx.fillRect(x + i * 11, y0 + 22, 9, 10);
        }
      }
      pips("JUMP", p.jump, 130);
      pips("BOOST", p.glide, 210);
      pips("SPEED", p.speed, 290);

      const mx = 380;
      const mw = Math.max(80, Math.min(200, w - 620));
      ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
      ctx.fillStyle = snap.gliding ? "#9cffff" : "rgba(214,247,255,0.7)";
      ctx.fillText("FUEL", mx, y0 + 16);
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(mx, y0 + 22, mw, 10);
      ctx.fillStyle = snap.gliding ? "#9cffff" : snap.meter > 0.25 ? "#5cf0ff" : "#ffd24a";
      ctx.fillRect(mx, y0 + 22, mw * snap.meter, 10);

      ctx.textAlign = "right";
      ctx.font = "700 13px ui-sans-serif, system-ui, sans-serif";
      ctx.fillStyle = "#fff4d2";
      ctx.fillText(`TIX ${p.tickets}`, w - 28, y0 + 20);
      ctx.fillStyle = "rgba(214,247,255,0.75)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(`BEST ${p.best}`, w - 28, y0 + 36);
      ctx.textAlign = "left";
    }

    function drawPlay() {
      const { w, h } = Kernel.view;
      const cam = Buildings.camX();
      const snap = Ball.snapshot();
      drawSky(w, h);
      const gy = Buildings.screenY(Buildings.groundY());
      ctx.fillStyle = "#0a0614";
      ctx.fillRect(0, gy, w, h);
      drawGridFloor(gy);

      const list = Buildings.buildings();
      for (let i = 0; i < list.length; i++) {
        const b = list[i];
        if (b.x + b.w < cam - 30 || b.x > cam + w + 30) continue;
        drawBuilding(b, cam);
      }

      drawBall(snap, cam);
      Goal.draw();
      drawScanlines();
      drawHud(snap);
      drawCabinet();
    }

    return { drawPlay, drawBall, drawBandedSun, drawScanlines, drawCabinet, drawGridFloor };
  })();

  /* ── Goal ───────────────────────────────────────────────── */
  const Goal = (() => {
    const ctx = Kernel.ctx;
    const BANDS = ["#fff6a8", "#ffe14a", "#ffb02e", "#ff7a3c", "#ff4da0", "#ff2d88", "#c42cff", "#6b1ad6"];
    let claimed = false;

    function reset() { claimed = false; }

    function disc() {
      const g = Buildings.gate();
      return { x: g.x, y: g.y - 52, r: 32 };
    }

    function update() {
      if (claimed || Menus.current() !== "playStub") return;
      const s = Ball.snapshot();
      if (!s.alive) return;
      const d = disc();
      if (Math.hypot(s.x - d.x, s.y - d.y) < d.r + s.r * 0.35) {
        claimed = true;
        Ball.finish();
        Kernel.bus.emit("finished", { distance: s.distance });
      }
    }

    function draw() {
      const cam = Buildings.camX();
      const g = Buildings.gate();
      const d = disc();
      const x = d.x - cam;
      const y = Buildings.screenY(d.y);
      const roof = Buildings.screenY(g.y);
      ctx.fillStyle = "#2a1458";
      ctx.strokeStyle = "#ffd24a";
      ctx.lineWidth = 3;
      ctx.fillRect(x - 40, y, 10, roof - y);
      ctx.fillRect(x + 30, y, 10, roof - y);
      ctx.strokeRect(x - 40, y, 10, roof - y);
      ctx.strokeRect(x + 30, y, 10, roof - y);
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, d.r, 0, Math.PI * 2);
      ctx.clip();
      const hh = d.r * 2;
      for (let i = 0; i < BANDS.length; i++) {
        ctx.fillStyle = BANDS[i];
        ctx.fillRect(x - d.r - 1, y - d.r + (hh * i) / BANDS.length, d.r * 2 + 2, hh / BANDS.length + 1);
      }
      ctx.restore();
      ctx.beginPath();
      ctx.arc(x, y, d.r, 0, Math.PI * 2);
      ctx.strokeStyle = claimed ? "#5cf0ff" : "rgba(255,240,180,0.9)";
      ctx.shadowColor = "#ffd24a";
      ctx.shadowBlur = 16;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    Kernel.bus.on("screen", name => {
      if (name === "playStub") reset();
    });

    return { update, draw, reset };
  })();

  /* ── Audio ──────────────────────────────────────────────── */
  const AudioFx = (() => {
    let ctx = null;
    let music = null;
    let loops = null;

    function noiseBuf(ac, seconds) {
      const n = Math.floor(ac.sampleRate * seconds);
      const buf = ac.createBuffer(1, n, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    }

    function tone(freq, dur, type, vol, t, dest, slide, filterHz) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      const f = ctx.createBiquadFilter();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
      f.type = "lowpass";
      f.frequency.value = filterHz || 1200;
      g.gain.setValueAtTime(Math.max(0.0001, vol), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(f);
      f.connect(g);
      g.connect(dest);
      o.start(t);
      o.stop(t + dur + 0.02);
    }

    function stopLoops() {
      if (!loops) return;
      try {
        loops.rollSrc.stop();
        loops.whooshSrc.stop();
        loops.boostO.stop();
        loops.lfo.stop();
      } catch (e) {}
      loops = null;
    }

    function startLoops() {
      if (loops || !ctx || Kernel.isMute()) return;
      const t = ctx.currentTime;
      const nbuf = noiseBuf(ctx, 1.5);

      const rollSrc = ctx.createBufferSource();
      rollSrc.buffer = nbuf;
      rollSrc.loop = true;
      const rollF = ctx.createBiquadFilter();
      rollF.type = "lowpass";
      rollF.frequency.value = 220;
      const rollG = ctx.createGain();
      rollG.gain.value = 0;
      rollSrc.connect(rollF);
      rollF.connect(rollG);
      rollG.connect(ctx.destination);
      rollSrc.start(t);

      const whooshSrc = ctx.createBufferSource();
      whooshSrc.buffer = nbuf;
      whooshSrc.loop = true;
      const whooshF = ctx.createBiquadFilter();
      whooshF.type = "lowpass";
      whooshF.frequency.value = 380;
      const whooshG = ctx.createGain();
      whooshG.gain.value = 0;
      whooshSrc.connect(whooshF);
      whooshF.connect(whooshG);
      whooshG.connect(ctx.destination);
      whooshSrc.start(t);

      const boostO = ctx.createOscillator();
      boostO.type = "sine";
      boostO.frequency.value = 62;
      const boostG = ctx.createGain();
      boostG.gain.value = 0;
      const lfo = ctx.createOscillator();
      lfo.type = "sine";
      lfo.frequency.value = 3.2;
      const lfoG = ctx.createGain();
      lfoG.gain.value = 0;
      lfo.connect(lfoG);
      lfoG.connect(boostG.gain);
      boostO.connect(boostG);
      boostG.connect(ctx.destination);
      boostO.start(t);
      lfo.start(t);

      loops = { rollSrc, rollF, rollG, whooshSrc, whooshF, whooshG, boostO, boostG, lfo, lfoG };
    }

    function ensure() {
      if (Kernel.isMute()) return null;
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      startMusic();
      startLoops();
      return ctx;
    }

    function startMusic() {
      if (music || !ctx || Kernel.isMute()) return;
      const master = ctx.createGain();
      master.gain.value = 0.12;
      master.connect(ctx.destination);
      const drive = ctx.createWaveShaper();
      const curve = new Float32Array(256);
      for (let i = 0; i < 256; i++) {
        const x = (i / 255) * 2 - 1;
        curve[i] = Math.tanh(x * 1.6);
      }
      drive.curve = curve;
      drive.oversample = "2x";
      const arpBus = ctx.createGain();
      arpBus.gain.value = 0.7;
      arpBus.connect(drive);
      drive.connect(master);
      const nb = noiseBuf(ctx, 0.35);
      let step = 0;
      const interval = 60 / 91 / 2;
      const chords = [
        [220.00, 261.63, 329.63],
        [246.94, 196.00, 293.66],
        [174.61, 220.00, 261.63],
        [146.83, 174.61, 220.00]
      ];
      const roots = [55.00, 61.74, 43.65, 36.71];

      function arpNote(freq, t) {
        for (const det of [0.996, 1.004]) {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          const f = ctx.createBiquadFilter();
          o.type = "sawtooth";
          o.frequency.value = freq * det;
          f.type = "lowpass";
          f.Q.value = 4;
          f.frequency.setValueAtTime(2100, t);
          f.frequency.exponentialRampToValueAtTime(520, t + 0.22);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.055, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
          o.connect(f);
          f.connect(g);
          g.connect(arpBus);
          o.start(t);
          o.stop(t + 0.3);
        }
      }

      function pad(chord, dur, t) {
        for (let i = 0; i < chord.length; i++) {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          const f = ctx.createBiquadFilter();
          o.type = "sawtooth";
          o.frequency.value = chord[i] * (i === 0 ? 0.5 : 1);
          f.type = "lowpass";
          f.frequency.value = 380;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.028, t + 0.4);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(f);
          f.connect(g);
          g.connect(master);
          o.start(t);
          o.stop(t + dur + 0.02);
        }
      }

      function bass(freq, t) {
        const o = ctx.createOscillator();
        const sub = ctx.createOscillator();
        const g = ctx.createGain();
        const f = ctx.createBiquadFilter();
        o.type = "sawtooth";
        sub.type = "sine";
        o.frequency.value = freq;
        sub.frequency.value = freq;
        f.type = "lowpass";
        f.Q.value = 7;
        f.frequency.setValueAtTime(1100, t);
        f.frequency.exponentialRampToValueAtTime(160, t + 0.55);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
        o.connect(f);
        f.connect(g);
        sub.connect(g);
        g.connect(master);
        o.start(t);
        sub.start(t);
        o.stop(t + 0.9);
        sub.stop(t + 0.9);
      }

      function kick(t) {
        tone(64, 0.32, "sine", 0.6, t, master, 26, 160);
      }

      function snare(t) {
        function burst(start, dur, vol, freq, q) {
          const src = ctx.createBufferSource();
          const g = ctx.createGain();
          const f = ctx.createBiquadFilter();
          src.buffer = nb;
          f.type = "bandpass";
          f.frequency.value = freq;
          f.Q.value = q;
          g.gain.setValueAtTime(vol, start);
          g.gain.setValueAtTime(vol * 0.85, start + 0.04);
          g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          src.connect(f);
          f.connect(g);
          g.connect(master);
          src.start(start);
          src.stop(start + dur + 0.02);
        }
        burst(t, 0.07, 0.2, 1800, 0.8);
        burst(t, 0.16, 0.11, 900, 0.4);
        tone(180, 0.08, "triangle", 0.04, t, master, 90, 700);
      }

      const id = setInterval(() => {
        if (Kernel.isMute() || !ctx) return;
        const t = ctx.currentTime + 0.03;
        const s = step % 8;
        const bar = Math.floor(step / 8) % 4;
        const chord = chords[bar];
        const arp = [chord[0], chord[1], chord[2], chord[0] * 2, chord[2], chord[1], chord[0], chord[2]];
        if (s === 0) {
          pad(chord, 2.5, t);
          bass(roots[bar], t);
          kick(t);
        }
        if (s === 4) kick(t);
        if (s === 2 || s === 6) snare(t);
        arpNote(arp[s], t);
        step++;
      }, interval * 1000);
      music = {
        stop() {
          clearInterval(id);
          try { master.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2); } catch (e) {}
          music = null;
        }
      };
    }

    function thump(start, end, dur, vol) {
      const ac = ensure();
      if (!ac) return;
      tone(start, dur, "sine", vol, ac.currentTime, ac.destination, end, 400);
    }

    function update() {
      if (Kernel.isMute()) {
        stopLoops();
        return;
      }
      if (!ctx) return;
      startLoops();
      if (!loops) return;
      const now = ctx.currentTime;
      const playing = Menus.current() === "playStub";
      const s = playing ? Ball.snapshot() : null;
      const speed = s && s.grounded ? Math.abs(s.vx) : 0;
      const rollVol = speed > 40 ? Math.min(0.028, (speed - 40) / 1400 * 0.028) : 0;
      loops.rollG.gain.setTargetAtTime(rollVol, now, 0.08);
      loops.rollF.frequency.setTargetAtTime(140 + speed * 0.35, now, 0.1);

      const boosting = !!(s && s.gliding);
      loops.whooshG.gain.setTargetAtTime(boosting ? 0.02 : 0, now, 0.08);
      loops.whooshF.frequency.setTargetAtTime(boosting ? 520 : 280, now, 0.12);
      loops.boostG.gain.setTargetAtTime(boosting ? 0.018 : 0.0001, now, 0.1);
      loops.lfoG.gain.setTargetAtTime(boosting ? 0.01 : 0, now, 0.1);
    }

    Kernel.bus.on("mute", on => {
      if (on) {
        if (music) music.stop();
        stopLoops();
      } else ensure();
    });
    Kernel.bus.on("jumped", p => {
      const t = (p && p.charge) || 0.6;
      thump(160 + t * 50, 70, 0.16, 0.045);
    });
    Kernel.bus.on("landed", () => thump(90, 40, 0.12, 0.04));
    Kernel.bus.on("fell", () => thump(70, 22, 0.32, 0.06));
    Kernel.bus.on("finished", () => {
      const ac = ensure();
      if (!ac) return;
      const t0 = ac.currentTime;
      tone(294, 0.35, "triangle", 0.04, t0, ac.destination, null, 900);
      tone(440, 0.45, "triangle", 0.035, t0 + 0.08, ac.destination, null, 1100);
    });

    return { ensure, update };
  })();

  /* ── Menus ──────────────────────────────────────────────── */
  const Menus = (() => {
    const ctx = Kernel.ctx;
    const BANDS = ["#fff6a8", "#ffe14a", "#ffb02e", "#ff7a3c", "#ff4da0", "#ff2d88", "#c42cff", "#6b1ad6"];
    const FACE = 'Impact, Haettenschweiler, "Arial Black", sans-serif';

    let screen = "main";
    let pickedMap = "blocks";
    let hits = [];
    let lastPointer = null;
    let lastRun = { distance: 0, earned: 0, finished: false };

    function go(name) {
      screen = name;
      Kernel.bus.emit("screen", name);
    }

    function current() { return screen; }
    function selectedMap() { return pickedMap; }

    function addHit(id, x, y, w, h) {
      hits.push({ id, x, y, w, h });
    }

    function hitAt(px, py) {
      for (let i = hits.length - 1; i >= 0; i--) {
        const b = hits[i];
        if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b.id;
      }
      return null;
    }

    function drawBackdrop() {
      const { w, h } = Kernel.view;
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "#050218");
      g.addColorStop(0.4, "#1a0670");
      g.addColorStop(0.7, "#7a1ad0");
      g.addColorStop(1, "#120436");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      const sunX = w * 0.5, sunY = h * 0.22, sunR = Math.min(120, h * 0.16);
      ctx.save();
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
      ctx.clip();
      const bh = sunR * 2;
      for (let i = 0; i < BANDS.length; i++) {
        ctx.fillStyle = BANDS[i];
        ctx.fillRect(sunX - sunR - 1, sunY - sunR + (bh * i) / BANDS.length, sunR * 2 + 2, bh / BANDS.length + 1);
      }
      ctx.restore();
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,240,180,0.5)";
      ctx.lineWidth = 2;
      ctx.stroke();

      const horizon = h * 0.42;
      ctx.strokeStyle = "rgba(255,45,200,0.28)";
      ctx.lineWidth = 1;
      for (let i = -16; i <= 16; i++) {
        ctx.beginPath();
        ctx.moveTo(w * 0.5, horizon);
        ctx.lineTo(w * 0.5 + i * (w / 10), 0);
        ctx.stroke();
      }

      ctx.fillStyle = "#120428";
      ctx.beginPath();
      ctx.moveTo(0, horizon);
      for (let i = 0; i <= 18; i++) {
        const x = (w * i) / 18;
        const hh = 18 + ((i * 17) % 7) * 14 + (i % 3) * 10;
        ctx.lineTo(x, horizon - hh);
        ctx.lineTo(x + w / 36, horizon - hh * 0.55);
      }
      ctx.lineTo(w, horizon);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(60,246,255,0.25)";
      ctx.stroke();

      Look.drawGridFloor(horizon);
    }

    function panel(x, y, w, h) {
      ctx.fillStyle = "rgba(12, 6, 32, 0.72)";
      ctx.strokeStyle = "rgba(180,140,255,0.45)";
      ctx.lineWidth = 1.5;
      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x, y, w, h);
    }

    function button(id, x, y, w, h, label, sub, hot) {
      addHit(id, x, y, w, h);
      const blink = hot && Math.sin(performance.now() / 160) > 0;
      ctx.fillStyle = hot ? "rgba(255,80,180,0.28)" : "rgba(20,8,48,0.72)";
      ctx.strokeStyle = hot ? (blink ? "#fff4d2" : "#3cf6ff") : "#ff2da8";
      ctx.lineWidth = hot ? 3 : 2;
      ctx.shadowColor = hot ? "#3cf6ff" : "#ff2da8";
      ctx.shadowBlur = hot ? 12 : 6;
      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x, y, w, h);
      ctx.shadowBlur = 0;
      if (hot) {
        ctx.fillStyle = "#3cf6ff";
        ctx.beginPath();
        ctx.moveTo(x + 10, y + h / 2 - 7);
        ctx.lineTo(x + 22, y + h / 2);
        ctx.lineTo(x + 10, y + h / 2 + 7);
        ctx.fill();
      }
      ctx.fillStyle = "#fff4d2";
      ctx.font = `700 18px ${FACE}`;
      ctx.textAlign = "left";
      ctx.fillText(hot ? "▶  " + label.toUpperCase() : label.toUpperCase(), x + (hot ? 28 : 16), y + 24);
      if (sub) {
        ctx.fillStyle = "rgba(180,230,255,0.8)";
        ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
        ctx.fillText(sub, x + (hot ? 28 : 16), y + 44);
      }
    }

    function title(text, y) {
      const { w } = Kernel.view;
      ctx.save();
      ctx.textAlign = "center";
      ctx.font = `italic 800 52px ${FACE}`;
      ctx.fillStyle = "#ff2da8";
      ctx.fillText(text, w / 2 + 4, y + 4);
      ctx.fillStyle = "#3cf6ff";
      ctx.shadowColor = "#3cf6ff";
      ctx.shadowBlur = 18;
      ctx.fillText(text, w / 2, y);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,244,210,0.85)";
      ctx.lineWidth = 1.5;
      ctx.strokeText(text, w / 2, y);
      ctx.restore();
    }

    function subtitle(text, y) {
      const { w } = Kernel.view;
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(200,230,255,0.9)";
      ctx.font = "15px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(text, w / 2, y);
      ctx.textAlign = "left";
    }

    function drawBezel() {
      const { w, h } = Kernel.view;
      ctx.fillStyle = "rgba(6,2,20,0.82)";
      ctx.fillRect(14, h - 52, w - 28, 36);
      ctx.strokeStyle = "rgba(255,45,200,0.55)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(14, h - 52, w - 28, 36);
      ctx.textAlign = "center";
      ctx.font = `700 13px ${FACE}`;
      ctx.fillStyle = "#3cf6ff";
      ctx.fillText("ROOFTOP PLATFORMER", w / 2, h - 38);
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillStyle = "rgba(255,244,210,0.88)";
      ctx.fillText("HOLD SPACE TO CHARGE  ·  HOLD IN AIR TO BOOST  ·  ← → ROLL", w / 2, h - 22);
      ctx.textAlign = "left";
    }

    function drawTitleStats() {
      const { w, h } = Kernel.view;
      const p = Progression.snapshot();
      const bw = Math.min(420, w - 40);
      const bx = (w - bw) / 2;
      const by = Math.max(h * 0.50, 250) - 78;
      ctx.fillStyle = "rgba(8,2,28,0.7)";
      ctx.strokeStyle = "rgba(60,246,255,0.45)";
      ctx.lineWidth = 1.5;
      ctx.fillRect(bx, by, bw, 64);
      ctx.strokeRect(bx, by, bw, 64);
      function pips(label, lv, x) {
        ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
        ctx.fillStyle = "#3cf6ff";
        ctx.fillText(label, x, by + 20);
        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = i < lv ? "#ffd24a" : "rgba(255,255,255,0.12)";
          ctx.fillRect(x + i * 12, by + 28, 10, 12);
        }
      }
      pips("JUMP", p.jump, bx + 16);
      pips("BOOST", p.glide, bx + 110);
      pips("SPEED", p.speed, bx + 204);
      ctx.textAlign = "right";
      ctx.fillStyle = "#fff4d2";
      ctx.font = `700 14px ${FACE}`;
      ctx.fillText(`TIX ${p.tickets}`, bx + bw - 14, by + 24);
      ctx.fillStyle = "rgba(214,247,255,0.8)";
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(`BEST ${p.best}`, bx + bw - 14, by + 46);
      ctx.textAlign = "left";
    }

    function drawMain() {
      const { w, h } = Kernel.view;
      title("SLOPEYBALLS", 62);
      const bw = Math.min(420, w - 40);
      const bx = (w - bw) / 2;
      let by = Math.max(h * 0.50, 250);
      drawTitleStats();
      button("play", bx, by, bw, 56, "Play", "Choose a map", true);
      by += 66;
      button("mute", bx, by, bw, 56, Kernel.isMute() ? "Sound: Off" : "Sound: On", "Toggle mute", false);
      by += 66;
      button("reset", bx, by, bw, 56, "Reset progress", "Erases upgrades and tickets", false);
    }

    function drawMaps() {
      const { w, h } = Kernel.view;
      title("SELECT MAP", 62);
      const bw = Math.min(420, w - 40);
      const bx = (w - bw) / 2;
      let by = Math.max(h * 0.46, 200);
      for (const map of Buildings.listMaps()) {
        button("map:" + map.id, bx, by, bw, 56, map.name, map.blurb, map.id === pickedMap);
        by += 66;
      }
      button("back", bx, by + 8, bw, 56, "Back", "", false);
    }

    function drawResetConfirm() {
      const { w, h } = Kernel.view;
      title("RESET ALL?", 62);
      const bw = Math.min(420, w - 40);
      const bx = (w - bw) / 2;
      const by = h * 0.5;
      subtitle("This wipes JUMP, BOOST, SPEED, tickets, and bests.", by - 28);
      button("erase", bx, by, bw, 56, "Erase everything", "Cannot be undone", false);
      button("cancel", bx, by + 66, bw, 56, "Cancel", "", true);
    }

    function drawPlayChrome() {
      button("pause", 16, 16, 100, 40, "Pause", "", false);
    }

    function drawPause() {
      const { w, h } = Kernel.view;
      ctx.fillStyle = "rgba(6,2,20,0.55)";
      ctx.fillRect(0, 0, w, h);
      title("PAUSED", 62);
      const bw = Math.min(420, w - 40);
      const bx = (w - bw) / 2;
      let by = h * 0.4;
      button("resume", bx, by, bw, 56, "Resume", "", true);
      by += 66;
      button("restart", bx, by, bw, 56, "Restart map", "Keep upgrades", false);
      by += 66;
      button("menu", bx, by, bw, 56, "Main menu", "", false);
    }

    function drawUpgrade() {
      const { w, h } = Kernel.view;
      const p = Progression.snapshot();
      title(lastRun.finished ? "SUN GATE" : "FELL", 58);
      const bw = Math.min(440, w - 40);
      const bx = (w - bw) / 2;
      let by = Math.max(h * 0.36, 200);
      subtitle(
        `${lastRun.distance} M   ·   +${lastRun.earned} TIX   ·   BEST ${p.best}`,
        by - 10
      );
      const rows = [
        ["jump", "JUMP", "Charge higher on the roof"],
        ["glide", "GLIDE", "Hold jump in air to boost"],
        ["speed", "SPEED", "Roll harder left and right"]
      ];
      for (const [id, label, blurb] of rows) {
        const lv = p[id];
        const maxed = lv >= p.cap;
        const c = p.nextCost[id];
        const sub = maxed ? `${blurb}.  MAX` : `${blurb}.  Lv ${lv} → ${c} tickets`;
        button("buy:" + id, bx, by, bw, 56, `${label}  Lv ${lv}`, sub, false);
        by += 64;
      }
      button("restart", bx, by + 8, bw, 56, "Restart map", "Keep these upgrades", true);
      button("menu", bx, by + 74, bw, 56, "Main menu", "", false);
    }

    function draw() {
      hits = [];
      ctx.setTransform(Kernel.view.s, 0, 0, Kernel.view.s, 0, 0);
      const inWorld = screen === "playStub" || screen === "pause";
      if (inWorld) {
        Look.drawPlay();
        if (screen === "playStub") drawPlayChrome();
        else {
          drawPlayChrome();
          hits = [];
          drawPause();
        }
        return;
      }
      drawBackdrop();
      if (screen === "main") drawMain();
      else if (screen === "maps") drawMaps();
      else if (screen === "resetConfirm") drawResetConfirm();
      else if (screen === "upgrade") drawUpgrade();
      drawBezel();
      Look.drawScanlines();
      Look.drawCabinet();
    }

    function onPointer(kind, cx, cy) {
      lastPointer = { kind, x: cx, y: cy };
      if (kind !== "down") return;
      const id = hitAt(cx, cy);
      if (!id) return;
      if (id === "play") go("maps");
      else if (id === "mute") Kernel.setMute(!Kernel.isMute());
      else if (id === "reset") go("resetConfirm");
      else if (id === "back" || id === "cancel") go("main");
      else if (id === "erase") {
        Progression.resetAll();
        go("main");
      } else if (id.startsWith("map:")) {
        pickedMap = id.slice(4);
        Buildings.load(pickedMap);
        go("playStub");
      } else if (id === "pause") go("pause");
      else if (id === "resume") go("playStub");
      else if (id === "restart") {
        Buildings.load(pickedMap);
        Ball.spawn();
        go("playStub");
      }
      else if (id === "menu") go("main");
      else if (id.startsWith("buy:")) Progression.buy(id.slice(4));
    }

    function onKey(e) {
      if (e.key === "Escape" || e.key === "p" || e.key === "P") {
        if (screen === "playStub") go("pause");
        else if (screen === "pause") go("playStub");
        else if (screen === "maps" || screen === "resetConfirm" || screen === "upgrade") go("main");
      }
    }

    function pointerFromEvent(e) {
      const rect = Kernel.canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    Kernel.canvas.addEventListener("pointerdown", e => {
      e.preventDefault();
      AudioFx.ensure();
      Kernel.canvas.setPointerCapture(e.pointerId);
      const p = pointerFromEvent(e);
      onPointer("down", p.x, p.y);
      if (screen === "playStub" && !hitAt(p.x, p.y)) Controls.pointer("down", p.x, p.y);
    });
    Kernel.canvas.addEventListener("pointermove", e => {
      if (!e.buttons || screen !== "playStub") return;
      const p = pointerFromEvent(e);
      if (!hitAt(p.x, p.y)) Controls.pointer("move", p.x, p.y);
    });
    Kernel.canvas.addEventListener("pointerup", e => {
      if (screen === "playStub") Controls.pointer("up");
    });
    window.addEventListener("keydown", onKey);

    function endRun(payload, finished) {
      lastRun = Progression.recordRun({ distance: payload && payload.distance, finished });
      go("upgrade");
    }
    Kernel.bus.on("fell", p => endRun(p, false));
    Kernel.bus.on("finished", p => endRun(p, true));

    return { draw, go, current, selectedMap, onPointer };
  })();

  /* ── Shell ──────────────────────────────────────────────── */
  const Shell = (() => {
    let last = performance.now();

    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      Controls.update(dt);
      const screen = Menus.current();
      if (screen === "playStub") {
        Ball.update(dt);
        Goal.update(dt);
      }
      AudioFx.update();
      Menus.draw();
      requestAnimationFrame(frame);
    }

    function start() {
      requestAnimationFrame(frame);
    }

    return { start };
  })();

  Shell.start();
})();
</script>
</body>
